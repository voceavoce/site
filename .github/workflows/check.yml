name: Check

# Gira SOLO sulle pull request (scelta dell'utente, 2026-10-16): i push sui branch di lavoro non
# fanno partire la CI, i controlli arrivano quando si apre la PR, prima del merge. Si puo' anche
# avviare a mano da Actions -> Check -> Run workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run search
      - run: npm run lint:html
      - name: Accessibilita (pa11y-ci, axe)
        run: npm run a11y

  # Test end-to-end divisi in 3 job in parallelo (un solo worker per job: i test misurano tempi di riproduzione).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Browser per i test end-to-end (Chromium di Playwright)
        run: npx playwright install --with-deps chromium
      - name: Test end-to-end (Playwright, parte ${{ matrix.shard }}/3)
        run: npm run e2e -- --shard=${{ matrix.shard }}/3
      - name: Report e trace dei test end-to-end
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
