name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Ogni giorno: fa comparire i video programmati il giorno del loro publish_at.
    - cron: "15 4 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: node --test $(find tests -name '*.test.mjs' ! -name note.test.mjs)
      # Le note mancanti in una lingua non fermano il deploy giornaliero: restano un avviso (anche in check.yml); `npm run check` in locale le segnala come errore.
      - run: node --test tests/note.test.mjs
        continue-on-error: true
      - run: npm run build
        env:
          ELEVENTY_ENV: production # esclude i dati di prova del player (content/player/_prova)
      - run: npm run search
      - run: npm run lint:html
      - name: Accessibilita (pa11y-ci, axe)
        run: npm run a11y
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
