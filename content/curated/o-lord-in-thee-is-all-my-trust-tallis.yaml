nota:
  it: "Brano per quattro voci miste di Thomas Tallis (circa 1505–1585), compositore inglese del Rinascimento, in inglese. La tonalità è sol minore. Con quattro linee di peso pari, conviene curare l'intonazione e l'equilibrio fra le voci."
  en: "A piece for four mixed voices (SATB) by Thomas Tallis (c. 1505–1585), an English Renaissance composer, in English. The key is G minor. With four lines of equal weight, intonation and balance between the voices are the thing to work on."
  es: "Obra para cuatro voces mixtas de Thomas Tallis (hacia 1505–1585), compositor inglés del Renacimiento, en inglés. La tonalidad es sol menor. Con cuatro líneas de igual peso, conviene cuidar la afinación y el equilibrio entre las voces."
  de: "Stück für vier gemischte Stimmen von Thomas Tallis (um 1505–1585), einem englischen Komponisten der Renaissance, auf Englisch. Die Tonart ist g-Moll. Bei vier gleichwertigen Stimmen kommt es vor allem auf Intonation und Stimmbalance an."
  fr: "Pièce pour quatre voix mixtes de Thomas Tallis (vers 1505–1585), compositeur anglais de la Renaissance, en anglais. La tonalité est sol mineur. Avec quatre lignes de poids égal, il faut soigner la justesse et l'équilibre entre les voix."
