nota:
  it: "Anthem tratto dall'oratorio The Crucifixion di John Stainer (1840–1901), del 1887. Il testo è Giovanni 3,16; la melodia è semplice, da cantare con linea omogenea."
  en: "An anthem from John Stainer's oratorio The Crucifixion (1887). The text is John 3:16; the tune is simple and best sung with an even, smooth line."
  es: "Anthem tomado del oratorio The Crucifixion de John Stainer (1840–1901), de 1887. El texto es Juan 3,16; la melodía es sencilla, para cantar con línea homogénea."
  de: "Anthem aus dem Oratorium The Crucifixion von John Stainer (1887). Der Text ist Johannes 3,16; die Melodie ist schlicht und wird am besten mit gleichmäßiger, ruhiger Linie gesungen."
  fr: "Anthem tiré de l'oratorio The Crucifixion de John Stainer (1887). Le texte est Jean 3,16 ; la mélodie est simple et se chante au mieux avec une ligne régulière et souple."
