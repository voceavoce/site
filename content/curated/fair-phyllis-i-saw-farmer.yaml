nota:
  it: "Madrigale inglese a quattro voci di John Farmer, dal suo libro di madrigali del 1599. Racconta una scena pastorale con tipici effetti descrittivi sulle parole."
  en: "A four-voice English madrigal by John Farmer, from his 1599 book of madrigals. It tells a pastoral scene with the typical word-painting of the genre."
  es: "Madrigal inglés a cuatro voces de John Farmer, de su libro de madrigales de 1599. Cuenta una escena pastoral con los típicos efectos descriptivos sobre el texto."
  de: "Vierstimmiges englisches Madrigal von John Farmer, aus seinem Madrigalbuch von 1599. Es erzählt eine pastorale Szene mit der für die Gattung typischen Tonmalerei."
  fr: "Madrigal anglais à quatre voix de John Farmer, tiré de son livre de madrigaux de 1599. Il raconte une scène pastorale avec la peinture sonore typique du genre."
