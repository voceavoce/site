nota:
  it: "Il testo, di Nahum Tate (1700), parafrasa il racconto dei pastori in Luca 2. La melodia è di Richard Allison, dal Salterio inglese del 1599."
  en: "The text, by Nahum Tate (1700), paraphrases the shepherds' story in Luke 2. The tune is by Richard Allison, from the English Psalter of 1599."
  es: "El texto, de Nahum Tate (1700), parafrasea el relato de los pastores en Lucas 2. La melodía es de Richard Allison, del Salterio inglés de 1599."
