nota:
  it: "Mottetto di Tomás Luis de Victoria (1548–1611) sul racconto di Isaia 6: due serafini si rispondono gridando «Santo». La scrittura imita il dialogo fra le voci."
  en: "A motet by Tomás Luis de Victoria (1548–1611) on the passage of Isaiah 6: two seraphim call to each other crying “Holy”. The writing imitates that dialogue between the voices."
  es: "Motete de Tomás Luis de Victoria (1548–1611) sobre el pasaje de Isaías 6: dos serafines se responden gritando «Santo». La escritura imita ese diálogo entre las voces."
  de: "Motette von Tomás Luis de Victoria (1548–1611) über die Stelle in Jesaja 6: Zwei Seraphim rufen einander „Heilig“ zu. Die Satzweise ahmt diesen Dialog zwischen den Stimmen nach."
  fr: "Motet de Tomás Luis de Victoria (1548–1611) sur le passage d'Isaïe 6 : deux séraphins se répondent en criant « Saint ». L'écriture imite ce dialogue entre les voix."
