nota:
  it: "Responsorio di Tomás Luis de Victoria (1548–1611) sul testo di Isaia 53: «Egli si è caricato delle nostre sofferenze». Ascolto e dinamica sono centrali."
  en: "A responsory by Tomás Luis de Victoria (1548–1611) on the text of Isaiah 53: “Surely he has borne our infirmities”. Listening and dynamics are central."
  es: "Responsorio de Tomás Luis de Victoria (1548–1611) sobre el texto de Isaías 53: «Él soportó nuestros sufrimientos». La escucha y la dinámica son centrales."
