nota:
  it: "Benedizione corale a quattro voci di Peter Christian Lutkin, compositore americano, in inglese. Il testo è la benedizione sacerdotale del Libro dei Numeri (6,24-26); il brano si canta spesso a chiusura di un servizio, con un «Amen» finale."
  en: "A four-voice choral benediction by the American composer Peter Christian Lutkin. The text is the priestly blessing from the Book of Numbers (6:24-26); it is often sung at the close of a service, ending on an “Amen”."
  es: "Bendición coral a cuatro voces del compositor estadounidense Peter Christian Lutkin, en inglés. El texto es la bendición sacerdotal del Libro de los Números (6,24-26); se canta a menudo al final de un servicio, con un «Amén» final."
  de: "Vierstimmiger Chorsegen des amerikanischen Komponisten Peter Christian Lutkin, auf Englisch. Der Text ist der priesterliche Segen aus dem Buch Numeri (4. Mose 6,24–26); das Stück wird oft am Ende eines Gottesdienstes gesungen, mit einem abschließenden „Amen“."
  fr: "Bénédiction chorale à quatre voix du compositeur américain Peter Christian Lutkin, en anglais. Le texte est la bénédiction sacerdotale du livre des Nombres (6,24-26) ; elle se chante souvent à la fin d'un office, avec un « Amen » final."
