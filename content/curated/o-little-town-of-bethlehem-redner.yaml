nota:
  it: "Carol americano: il testo è di Phillips Brooks (1868) e la melodia «St. Louis» di Lewis Redner, composta per i bambini della sua scuola domenicale di Filadelfia."
  en: "An American carol: the text is by Phillips Brooks (1868) and the tune “St. Louis” by Lewis Redner, written for his Philadelphia Sunday-school children."
  es: "Villancico estadounidense: el texto es de Phillips Brooks (1868) y la melodía «St. Louis» de Lewis Redner, escrita para los niños de su escuela dominical de Filadelfia."
  de: "Amerikanisches Carol: Der Text stammt von Phillips Brooks (1868), die Melodie „St. Louis“ von Lewis Redner, geschrieben für die Kinder seiner Sonntagsschule in Philadelphia."
  fr: "Chant de Noël américain : le texte est de Phillips Brooks (1868) et la mélodie « St. Louis » de Lewis Redner, écrite pour les enfants de son école du dimanche de Philadelphie."
