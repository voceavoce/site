nota:
  it: "Carol tradizionale inglese nell'arrangiamento di John Stainer (1840–1901), pubblicato in Christmas Carols New and Old (1871). Racconta la visita dei pastori e dei Magi."
  en: "A traditional English carol in John Stainer's (1840–1901) arrangement, published in Christmas Carols New and Old (1871). It tells of the shepherds and the Magi."
  es: "Villancico tradicional inglés en el arreglo de John Stainer (1840–1901), publicado en Christmas Carols New and Old (1871). Cuenta la visita de los pastores y de los Magos."
  de: "Traditionelles englisches Carol im Arrangement von John Stainer (1840–1901), veröffentlicht in Christmas Carols New and Old (1871). Es erzählt von den Hirten und den Weisen."
  fr: "Chant de Noël traditionnel anglais dans l'arrangement de John Stainer (1840–1901), publié dans Christmas Carols New and Old (1871). Il raconte la visite des bergers et des Mages."
