nota:
  it: "Primo dei vocalizzi delle 50 Lezioni op. 9 di Giuseppe Concone (1801–1861), pensate per voce media. Si canta su vocali, senza testo: servono a curare intonazione, legato e regolarità del respiro."
  en: "The first of the vocalises in Giuseppe Concone's 50 Lessons op. 9 (1801–1861), written for medium voice. Sung on vowels without text, they build intonation, legato and steady breathing."
  es: "Primero de los vocalizos de las 50 Lecciones op. 9 de Giuseppe Concone (1801–1861), pensadas para voz media. Se cantan sobre vocales, sin texto: sirven para trabajar la afinación, el legato y la regularidad del aliento."
  de: "Die erste der Vokalisen aus Giuseppe Concones 50 Lektionen op. 9 (1801–1861), für mittlere Stimme geschrieben. Sie werden auf Vokalen ohne Text gesungen und schulen Intonation, Legato und gleichmäßige Atmung."
  fr: "La première des vocalises des 50 Leçons op. 9 de Giuseppe Concone (1801–1861), écrites pour voix moyenne. Chantées sur des voyelles, sans texte, elles travaillent la justesse, le legato et la régularité du souffle."
