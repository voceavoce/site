nota:
  it: "Inno della Trasfigurazione che Thomas Tallis (c. 1505–1585) mise in musica a cinque voci, pubblicato nelle Cantiones sacrae (1575). Armonie scorrevoli, accordi pieni."
  en: "A hymn for the Transfiguration that Thomas Tallis (c. 1505–1585) set for five voices, published in the Cantiones sacrae (1575). Flowing harmonies, full chords."
  es: "Himno de la Transfiguración que Thomas Tallis (c. 1505–1585) puso en música a cinco voces, publicado en las Cantiones sacrae (1575). Armonías fluidas, acordes plenos."
  de: "Hymnus zum Fest der Verklärung, den Thomas Tallis (um 1505–1585) für fünf Stimmen vertonte, veröffentlicht in den Cantiones sacrae (1575). Fließende Harmonien, volle Akkorde."
  fr: "Hymne de la Transfiguration que Thomas Tallis (vers 1505–1585) a mis en musique à cinq voix, publié dans les Cantiones sacrae (1575). Des harmonies fluides, des accords pleins."
