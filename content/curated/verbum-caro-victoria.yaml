nota:
  it: "Brano a tre voci (soprano, contralto e tenore) di Tomás Luis de Victoria (1548–1611), compositore spagnolo del Rinascimento, in latino. Il titolo, «Verbum caro», richiama le parole «il Verbo si fece carne» (Giovanni 1,14). Senza la voce di basso il suono è più chiaro e leggero, e l'intonazione fra le tre voci va curata con attenzione."
  en: "A piece for three voices (soprano, alto and tenor) by Tomás Luis de Victoria (1548–1611), a Spanish Renaissance composer, in Latin. The title, “Verbum caro”, recalls the words “the Word became flesh” (John 1:14). Without a bass voice the sound is lighter and clearer, and intonation among the three voices needs careful attention."
  es: "Obra para tres voces (soprano, contralto y tenor) de Tomás Luis de Victoria (1548–1611), compositor español del Renacimiento, en latín. El título, «Verbum caro», recuerda las palabras «el Verbo se hizo carne» (Juan 1,14). Sin voz de bajo el sonido es más claro y ligero, y la afinación entre las tres voces exige atención."
  de: "Stück für drei Stimmen (Sopran, Alt und Tenor) von Tomás Luis de Victoria (1548–1611), einem spanischen Komponisten der Renaissance, auf Latein. Der Titel „Verbum caro“ erinnert an die Worte „das Wort ist Fleisch geworden“ (Johannes 1,14). Ohne Bassstimme klingt es heller und leichter, und die Intonation zwischen den drei Stimmen verlangt besondere Aufmerksamkeit."
  fr: "Pièce à trois voix (soprano, alto et ténor) de Tomás Luis de Victoria (1548–1611), compositeur espagnol de la Renaissance, en latin. Le titre, « Verbum caro », rappelle les mots « le Verbe s'est fait chair » (Jean 1,14). Sans voix de basse, le son est plus clair et plus léger, et la justesse entre les trois voix demande de l'attention."
