nota:
  it: "Mottetto pasquale a cinque voci di Orlando di Lasso (c. 1532–1594): «È risorto il buon pastore, che ha dato la vita per le sue pecore»."
  en: "An Easter motet for five voices by Orlando di Lasso (c. 1532–1594): “The good shepherd has risen, who gave his life for his sheep”."
  es: "Motete pascual a cinco voces de Orlando di Lasso (c. 1532–1594): «Ha resucitado el buen pastor, que dio la vida por sus ovejas»."
