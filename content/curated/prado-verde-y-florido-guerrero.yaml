nota:
  it: "Canzone spagnola rinascimentale a quattro voci di Francisco Guerrero (1528–1599). Immagini di natura in uno stile leggero e cantabile."
  en: "A Spanish Renaissance song for four voices by Francisco Guerrero (1528–1599). Images of nature in a light, singable style."
  es: "Canción española del Renacimiento a cuatro voces de Francisco Guerrero (1528–1599). Imágenes de la naturaleza en un estilo ligero y cantable."
  de: "Spanisches Renaissancelied für vier Stimmen von Francisco Guerrero (1528–1599). Naturbilder in leichtem, sangbarem Stil."
  fr: "Chanson espagnole de la Renaissance à quatre voix de Francisco Guerrero (1528–1599). Des images de la nature dans un style léger et chantant."
