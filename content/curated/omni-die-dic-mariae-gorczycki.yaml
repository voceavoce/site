nota:
  it: "Brano mariano in latino a quattro voci di Grzegorz Gorczycki, compositore polacco del Barocco. Il testo «Omni die dic Mariae» («ogni giorno di' a Maria») è un inno devozionale."
  en: "A four-voice Latin Marian piece by Grzegorz Gorczycki, a Polish Baroque composer. The text “Omni die dic Mariae” (“every day say to Mary”) is a devotional hymn."
  es: "Obra mariana en latín a cuatro voces de Grzegorz Gorczycki, compositor polaco del Barroco. El texto «Omni die dic Mariae» («cada día di a María») es un himno devocional."
