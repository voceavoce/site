nota:
  it: "Inno mariano dei Vespri, di autore ignoto e già diffuso nel Medioevo, messo in musica da Edvard Grieg per otto voci. La scrittura a otto parti richiede ascolto attento tra i cori."
  en: "A Marian hymn from Vespers, by an unknown author and already widespread in the Middle Ages, set by Edvard Grieg for eight voices. The eight-part writing calls for careful listening between the parts."
  es: "Himno mariano de las Vísperas, de autor desconocido y ya difundido en la Edad Media, puesto en música por Edvard Grieg a ocho voces. La escritura a ocho partes exige una escucha atenta."
  de: "Marienhymnus der Vesper, von unbekanntem Verfasser und schon im Mittelalter verbreitet, von Edvard Grieg für acht Stimmen vertont. Die achtstimmige Schreibweise verlangt aufmerksames Hören zwischen den Stimmen."
  fr: "Hymne marial des Vêpres, d'auteur inconnu et déjà répandu au Moyen Âge, mis en musique par Edvard Grieg pour huit voix. L'écriture à huit parties demande une écoute attentive entre les voix."
