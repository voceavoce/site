nota:
  it: "Natale in musica di Gustav Holst (1874–1934) sul poema di Christina Rossetti. La melodia «Cranham» comparve nell'English Hymnal del 1906."
  en: "Gustav Holst's (1874–1934) Christmas setting of the poem by Christina Rossetti. The tune “Cranham” appeared in the English Hymnal of 1906."
  es: "Música navideña de Gustav Holst (1874–1934) sobre el poema de Christina Rossetti. La melodía «Cranham» apareció en el English Hymnal de 1906."
