nota:
  it: "Brano in spagnolo per tre voci (soprano, contralto e basso). Il titolo si può rendere «Tre giovani more mi fanno innamorare». Con sole tre voci ogni parte è scoperta: intonazione e ritmo di ciascuno si sentono subito, quindi vale la pena studiare con cura la propria linea."
  en: "A piece in Spanish for three voices (soprano, alto and bass). The title can be rendered “Three young Moorish girls make me fall in love”. With only three voices every part is exposed: each singer's intonation and rhythm are heard at once, so it pays to study your own line with care."
  es: "Obra en español para tres voces (soprano, contralto y bajo). Con solo tres voces cada parte queda al descubierto: la afinación y el ritmo de cada cantante se notan enseguida, así que conviene estudiar con cuidado la propia línea."
  de: "Stück auf Spanisch für drei Stimmen (Sopran, Alt und Bass). Der Titel lässt sich etwa wiedergeben als „Drei junge Maurinnen lassen mich in Liebe entbrennen“. Bei nur drei Stimmen liegt jede Partie offen: Intonation und Rhythmus jeder Stimme sind sofort zu hören, deshalb lohnt es sich, die eigene Linie sorgfältig zu üben."
  fr: "Pièce en espagnol pour trois voix (soprano, alto et basse). Le titre peut se rendre par « Trois jeunes Mauresques me font tomber amoureux ». Avec trois voix seulement, chaque partie est à découvert : la justesse et le rythme de chacun s'entendent aussitôt, il vaut donc la peine de travailler sa ligne avec soin."
