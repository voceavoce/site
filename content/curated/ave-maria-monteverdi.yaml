nota:
  it: "L'Ave Maria unisce le parole dell'angelo e di Elisabetta nel Vangelo di Luca con l'invocazione «Sancta Maria», entrata nell'uso più tardi. Questa versione di Claudio Monteverdi è per tre voci (soprano, alto e basso)."
  en: "The Ave Maria joins the words of the angel and of Elizabeth in Luke's Gospel with the invocation “Sancta Maria”, which entered use later. This setting by Claudio Monteverdi is for three voices (soprano, alto and bass)."
  es: "El Ave María une las palabras del ángel y de Isabel en el Evangelio de Lucas con la invocación «Sancta Maria», incorporada más tarde. Esta versión de Claudio Monteverdi es para tres voces (soprano, alto y bajo)."
  de: "Das Ave Maria verbindet die Worte des Engels und der Elisabeth im Lukasevangelium mit der später hinzugekommenen Anrufung „Sancta Maria“. Diese Vertonung von Claudio Monteverdi ist für drei Stimmen (Sopran, Alt und Bass)."
  fr: "L'Ave Maria associe les paroles de l'ange et d'Élisabeth dans l'Évangile de Luc à l'invocation « Sancta Maria », entrée dans l'usage plus tard. Cette version de Claudio Monteverdi est pour trois voix (soprano, alto et basse)."
