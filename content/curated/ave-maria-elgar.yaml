nota:
  it: "Ave Maria per quattro voci miste con organo di Edward Elgar (1857–1934), in latino. Il testo è la preghiera dell'Ave Maria. Il tempo è lento: contano il fiato, il legato e l'intonazione sulle note lunghe."
  en: "Ave Maria for four mixed voices (SATB) with organ by Edward Elgar (1857–1934), in Latin. The text is the Hail Mary prayer. The tempo is slow: breath control, legato and intonation on the long notes matter most."
  es: "Ave María para cuatro voces mixtas con órgano de Edward Elgar (1857–1934), en latín. El texto es la oración del Ave María. El tempo es lento: importan el aliento, el legato y la afinación en las notas largas."
  de: "Ave Maria für vier gemischte Stimmen mit Orgel von Edward Elgar (1857–1934), auf Latein. Der Text ist das Gebet Ave Maria. Das Tempo ist langsam: Atemführung, Legato und Intonation auf den langen Noten sind entscheidend."
  fr: "Ave Maria pour quatre voix mixtes avec orgue d'Edward Elgar (1857–1934), en latin. Le texte est la prière de l'Ave Maria. Le tempo est lent : le souffle, le legato et la justesse sur les notes longues comptent avant tout."
