nota:
  it: "Aria di Alessandro Scarlatti (1660–1725), dall'opera Pirro e Demetrio (1694), nota anche come «Arie antiche» da studio. Testo in italiano, ideale per lavorare su fraseggio e legato."
  en: "An aria by Alessandro Scarlatti (1660–1725), from the opera Pirro e Demetrio (1694), also known as a staple of the “Arie antiche” study repertoire. Italian text, ideal for phrasing and legato work."
  es: "Aria de Alessandro Scarlatti (1660–1725), de la ópera Pirro e Demetrio (1694), conocida también como pieza de estudio de las «Arie antiche». Texto en italiano, ideal para trabajar el fraseo y el legato."
