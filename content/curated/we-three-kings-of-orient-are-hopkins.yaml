nota:
  it: "Parole e musica di John Henry Hopkins Jr., scritte nel 1857 per una rappresentazione natalizia a New York. Ogni re ha una strofa: oro, incenso e mirra."
  en: "Words and music by John Henry Hopkins Jr., written in 1857 for a Christmas pageant in New York. Each king has a verse: gold, frankincense and myrrh."
  es: "Letra y música de John Henry Hopkins Jr., escritas en 1857 para una representación navideña en Nueva York. Cada rey tiene su estrofa: oro, incienso y mirra."
  de: "Text und Musik von John Henry Hopkins Jr., 1857 für ein Weihnachtsspiel in New York geschrieben. Jeder König hat eine Strophe: Gold, Weihrauch und Myrrhe."
  fr: "Paroles et musique de John Henry Hopkins Jr., écrites en 1857 pour une représentation de Noël à New York. Chaque roi a son couplet : l'or, l'encens et la myrrhe."
