nota:
  it: "Il testo è di Joseph Mohr e la musica di Franz Xaver Gruber: fu eseguito la vigilia di Natale del 1818 a Oberndorf, vicino a Salisburgo. Qui in versione a quattro voci, in tedesco."
  en: "The words are by Joseph Mohr and the music by Franz Xaver Gruber: it was performed on Christmas Eve 1818 at Oberndorf, near Salzburg. Here in a four-voice version, in German."
  es: "El texto es de Joseph Mohr y la música de Franz Xaver Gruber: se interpretó en Nochebuena de 1818 en Oberndorf, cerca de Salzburgo. Aquí en versión a cuatro voces, en alemán."
  de: "Der Text stammt von Joseph Mohr, die Musik von Franz Xaver Gruber: Das Lied wurde am Heiligabend 1818 in Oberndorf bei Salzburg aufgeführt. Hier in einer vierstimmigen Fassung, auf Deutsch."
  fr: "Les paroles sont de Joseph Mohr et la musique de Franz Xaver Gruber : le chant fut exécuté la veille de Noël 1818 à Oberndorf, près de Salzbourg. Ici dans une version à quatre voix, en allemand."
