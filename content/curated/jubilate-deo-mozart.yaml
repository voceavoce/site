nota:
  it: "Brano in latino a quattro voci attribuito a Wolfgang Amadeus Mozart (1756–1791). «Jubilate Deo» riprende l'incipit del Salmo 99 (100): un invito alla gioia."
  en: "A four-voice Latin piece attributed to Wolfgang Amadeus Mozart (1756–1791). “Jubilate Deo” echoes the opening of Psalm 99 (100): an invitation to joy."
  es: "Obra en latín a cuatro voces atribuida a Wolfgang Amadeus Mozart (1756–1791). «Jubilate Deo» recoge el comienzo del Salmo 99 (100): una invitación a la alegría."
