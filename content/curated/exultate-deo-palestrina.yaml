nota:
  it: "Mottetto a cinque voci di Giovanni Pierluigi da Palestrina (c. 1525–1594) sul versetto del Salmo 80 (81) «Esultate in Dio, nostro aiuto». Polifonia chiara e vocale, tipica dello stile palestriniano."
  en: "A five-voice motet by Giovanni Pierluigi da Palestrina (c. 1525–1594) on the verse of Psalm 80 (81), “Exult in God our helper”. Clear, vocal polyphony typical of Palestrina's style."
  es: "Motete a cinco voces de Giovanni Pierluigi da Palestrina (c. 1525–1594) sobre el versículo del Salmo 80 (81), «Exultad en Dios, nuestro auxilio». Polifonía clara y vocal, típica del estilo de Palestrina."
