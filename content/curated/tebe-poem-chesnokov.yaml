nota:
  it: "Brano della tradizione corale russa di Pavel Chesnokov (1877–1944), su un testo della Divina Liturgia di san Giovanni Crisostomo: «A te cantiamo». Qui è cantato in inglese."
  en: "A piece in the Russian choral tradition by Pavel Chesnokov (1877–1944), on a text from the Divine Liturgy of St John Chrysostom: “We sing to Thee”. Sung here in English."
  es: "Obra de la tradición coral rusa de Pavel Chesnokov (1877–1944), sobre un texto de la Divina Liturgia de san Juan Crisóstomo: «A ti te cantamos». Aquí se canta en inglés."
  de: "Stück aus der russischen Chortradition von Pawel Tschesnokow (1877–1944) auf einen Text der Göttlichen Liturgie des heiligen Johannes Chrysostomos: „Dir singen wir“. Hier auf Englisch gesungen."
  fr: "Pièce de la tradition chorale russe de Pavel Tchesnokov (1877–1944), sur un texte de la Divine Liturgie de saint Jean Chrysostome : « Nous te chantons ». Chantée ici en anglais."
