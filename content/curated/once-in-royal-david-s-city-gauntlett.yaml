nota:
  it: "Testo di Cecil Frances Alexander (1848) con la melodia «Irby» di Henry J. Gauntlett. Apre da anni la celebrazione natalizia di Nine Lessons and Carols del King's College di Cambridge."
  en: "Text by Cecil Frances Alexander (1848) to the tune “Irby” by Henry J. Gauntlett. It has long opened the Nine Lessons and Carols service at King's College, Cambridge."
  es: "Texto de Cecil Frances Alexander (1848) con la melodía «Irby» de Henry J. Gauntlett. Abre desde hace años el servicio navideño Nine Lessons and Carols del King's College de Cambridge."
  de: "Text von Cecil Frances Alexander (1848) zur Melodie „Irby“ von Henry J. Gauntlett. Es eröffnet seit Langem den Gottesdienst Nine Lessons and Carols am King's College in Cambridge."
  fr: "Texte de Cecil Frances Alexander (1848) sur la mélodie « Irby » de Henry J. Gauntlett. Il ouvre depuis longtemps l'office Nine Lessons and Carols du King's College de Cambridge."
