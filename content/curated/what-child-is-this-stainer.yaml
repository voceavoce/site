nota:
  it: "Il testo è di William Chatterton Dix (1865) e la melodia è l'antica «Greensleeves»; l'armonizzazione di John Stainer comparve in Christmas Carols New and Old (1871)."
  en: "The text is by William Chatterton Dix (1865) and the tune is the old “Greensleeves”; John Stainer's harmonisation appeared in Christmas Carols New and Old (1871)."
  es: "El texto es de William Chatterton Dix (1865) y la melodía es la antigua «Greensleeves»; la armonización de John Stainer apareció en Christmas Carols New and Old (1871)."
