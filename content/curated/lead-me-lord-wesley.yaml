nota:
  it: "Anthem inglese di Samuel Sebastian Wesley (1810–1876), su versetti dei Salmi 5 e 4: «Guidami, Signore, nella tua giustizia». Breve e di intensità crescente."
  en: "An English anthem by Samuel Sebastian Wesley (1810–1876) on verses from Psalms 5 and 4: “Lead me, Lord, in thy righteousness”. Short, with growing intensity."
  es: "Anthem inglés de Samuel Sebastian Wesley (1810–1876), sobre versículos de los Salmos 5 y 4: «Guíame, Señor, en tu justicia». Breve y de intensidad creciente."
  de: "Englisches Anthem von Samuel Sebastian Wesley (1810–1876) auf Verse aus den Psalmen 5 und 4: „Führe mich, Herr, in deiner Gerechtigkeit“. Kurz, mit wachsender Intensität."
  fr: "Anthem anglais de Samuel Sebastian Wesley (1810–1876) sur des versets des psaumes 5 et 4 : « Conduis-moi, Seigneur, dans ta justice ». Court, d'une intensité croissante."
