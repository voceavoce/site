nota:
  de: "Anmerkung zum Text: Bruckner vertonte den alten Text von Venantius Fortunatus; hier wird der Text des unter Urban VIII. überarbeiteten Breviers gesungen."
  fr: "Note sur le texte : Bruckner a mis en musique le texte ancien de Venance Fortunat ; ici on chante le texte du Bréviaire révisé sous Urbain VIII."
