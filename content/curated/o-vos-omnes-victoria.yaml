nota:
  it: "Responsorio del Sabato Santo (Lamentazioni 1,12) di Tomás Luis de Victoria (1548–1611): «O voi tutti che passate per la via, guardate se c'è dolore simile al mio». Sobrio e intenso."
  en: "A Holy Saturday responsory (Lamentations 1:12) by Tomás Luis de Victoria (1548–1611): “O all you who pass by, see if there is any sorrow like mine”. Sober and intense."
  es: "Responsorio del Sábado Santo (Lamentaciones 1,12) de Tomás Luis de Victoria (1548–1611): «Oh vosotros todos que pasáis por el camino, mirad si hay dolor como el mío». Sobrio e intenso."
  de: "Responsorium des Karsamstags (Klagelieder 1,12) von Tomás Luis de Victoria (1548–1611): „O ihr alle, die ihr des Weges zieht, schaut, ob ein Schmerz ist wie mein Schmerz“. Nüchtern und eindringlich."
  fr: "Répons du Samedi saint (Lamentations 1,12) de Tomás Luis de Victoria (1548–1611) : « Ô vous tous qui passez par le chemin, voyez s'il est une douleur semblable à ma douleur ». Sobre et intense."
