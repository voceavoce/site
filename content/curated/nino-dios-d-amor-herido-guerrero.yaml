nota:
  it: "Villancico natalizio di Francisco Guerrero (1528–1599), dalle Canciones y villanescas espirituales (Venezia, 1589). Testo in spagnolo sul Bambino «ferito d'amore»."
  en: "A Christmas villancico by Francisco Guerrero (1528–1599), from the Canciones y villanescas espirituales (Venice, 1589). Spanish text about the Child “wounded by love”."
  es: "Villancico navideño de Francisco Guerrero (1528–1599), de las Canciones y villanescas espirituales (Venecia, 1589). Texto en español sobre el Niño «herido de amor»."
