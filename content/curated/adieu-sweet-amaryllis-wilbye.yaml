nota:
  it: "Madrigale inglese a quattro voci di John Wilbye, pubblicato nel suo primo libro di madrigali (1598). È un addio pastorale in cui ogni voce imita l'altra: ottimo esercizio per entrare a tempo e tenere l'intonazione negli incastri."
  en: "A four-voice English madrigal by John Wilbye, published in his first book of madrigals (1598). A pastoral farewell in which the voices imitate one another: a good exercise in coming in on time and holding your pitch in the interlocking lines."
  es: "Madrigal inglés a cuatro voces de John Wilbye, publicado en su primer libro de madrigales (1598). Es una despedida pastoral en la que las voces se imitan entre sí: un buen ejercicio para entrar a tiempo y mantener la afinación."
  de: "Vierstimmiges englisches Madrigal von John Wilbye, veröffentlicht in seinem ersten Madrigalbuch (1598). Ein pastoraler Abschied, in dem sich die Stimmen gegenseitig nachahmen: eine gute Übung, pünktlich einzusetzen und in den verschränkten Linien die Tonhöhe zu halten."
  fr: "Madrigal anglais à quatre voix de John Wilbye, publié dans son premier livre de madrigaux (1598). Un adieu pastoral où les voix s'imitent l'une l'autre : un bon exercice pour entrer à temps et tenir la justesse dans les lignes imbriquées."
