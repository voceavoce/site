nota:
  it: "Le parole sono le ultime due strofe di un inno eucaristico di san Tommaso d'Aquino, cantate alla Benedizione. Questa versione è attribuita a Ludwig van Beethoven (1770–1827)."
  en: "The words are the last two stanzas of a Eucharistic hymn by Thomas Aquinas, sung at Benediction. This setting is attributed to Ludwig van Beethoven (1770–1827)."
  es: "Las palabras son las dos últimas estrofas de un himno eucarístico de santo Tomás de Aquino, cantadas en la Bendición. Esta versión se atribuye a Ludwig van Beethoven (1770–1827)."
