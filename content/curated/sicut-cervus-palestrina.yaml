nota:
  it: "Mottetto a quattro voci di Giovanni Pierluigi da Palestrina (c. 1525–1594) sul Salmo 41 (42): «Come la cerva anela ai corsi d'acqua». Polifonia limpida, ideale per lavorare su fiato e legato."
  en: "A four-voice motet by Giovanni Pierluigi da Palestrina (c. 1525–1594) on Psalm 41 (42): “As the deer longs for streams of water”. Clear polyphony, ideal for work on breath and legato."
  es: "Motete a cuatro voces de Giovanni Pierluigi da Palestrina (c. 1525–1594) sobre el Salmo 41 (42): «Como la cierva anhela las corrientes de agua». Polifonía límpida, ideal para trabajar el aliento y el legato."
