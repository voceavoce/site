comune: vexilla-regis
credit: "Traduzione automatica (Claude), non rivista"
license: "CC0 1.0"
righe:
  - { la: "Vexilla regis prodeunt", it: "Avanzano i vessilli del Re", en: "The banners of the King advance", es: "Avanzan los estandartes del Rey", de: "Es rücken vor die Banner des Königs", fr: "Les étendards du Roi s'avancent" }
  - { la: "fulget crucis mysterium", it: "risplende il mistero della croce", en: "the mystery of the cross shines", es: "resplandece el misterio de la cruz", de: "es leuchtet das Geheimnis des Kreuzes", fr: "le mystère de la croix resplendit" }
  - { la: "quo carne carnis conditor", it: "dove nella carne il creatore della carne", en: "where in the flesh the maker of flesh", es: "donde en la carne el creador de la carne", de: "wo im Fleisch der Schöpfer des Fleisches", fr: "où dans la chair le créateur de la chair" }
  - { la: "suspensus est patibulo", it: "è stato appeso al patibolo", en: "was hung upon the gibbet", es: "fue colgado del patíbulo", de: "am Galgen aufgehängt wurde", fr: "fut suspendu au gibet" }
  - { la: "confixa clavis viscera", it: "con le membra trafitte da chiodi", en: "his body pierced with nails", es: "con el cuerpo traspasado por clavos", de: "den Leib von Nägeln durchbohrt", fr: "le corps transpercé de clous" }
  - { la: "tendens manus vestigia", it: "tendendo mani e piedi", en: "stretching out his hands and feet", es: "extendiendo manos y pies", de: "Hände und Füße ausgestreckt", fr: "tendant les mains et les pieds" }
  - { la: "redemptionis gratia", it: "grazia della redenzione", en: "for the grace of redemption", es: "por la gracia de la redención", de: "aus Gnade der Erlösung", fr: "pour la grâce de la rédemption" }
  - { la: "hic immolata est hostia", it: "qui fu immolata la vittima", en: "here the sacrifice was offered", es: "aquí fue inmolada la víctima", de: "hier wurde das Opfer dargebracht", fr: "ici fut immolée la victime" }
  - { la: "quo vulneratus insuper", it: "Qui, ferito ancora", en: "Here, wounded further", es: "Aquí, herido además", de: "Hier, zudem verwundet", fr: "Ici, blessé de surcroît" }
  - { la: "mucrone diro lanceae", it: "dalla punta crudele di una lancia", en: "by the cruel point of a spear", es: "por la cruel punta de una lanza", de: "von der grausamen Lanzenspitze", fr: "par la pointe cruelle d'une lance" }
  - { la: "ut nos lavaret crimine", it: "per lavarci dalla colpa", en: "to cleanse us of sin", es: "para lavarnos del pecado", de: "um uns von der Schuld reinzuwaschen", fr: "pour nous laver du péché" }
  - { la: "manavit unda et sanguine", it: "fece sgorgare acqua e sangue", en: "he poured forth water and blood", es: "hizo brotar agua y sangre", de: "ließ er Wasser und Blut fließen", fr: "il fit jaillir l'eau et le sang" }
  - { la: "impleta sunt quae concinit", it: "Si è compiuto ciò che cantò", en: "Fulfilled is what David sang", es: "Se ha cumplido lo que cantó", de: "Erfüllt ist, was David", fr: "S'est accompli ce que chanta" }
  - { la: "David fideli carmine", it: "David con fedele canto", en: "in his faithful song", es: "David con fiel canto", de: "im treuen Lied sang", fr: "David dans son chant fidèle" }
  - { la: "dicendo nationibus", it: "dicendo alle nazioni", en: "saying to the nations", es: "diciendo a las naciones", de: "als er den Völkern sagte", fr: "en disant aux nations" }
  - { la: "regnavit a ligno Deus", it: "Dio ha regnato dal legno", en: "God has reigned from the tree", es: "Dios ha reinado desde el madero", de: "Gott hat vom Holz aus geherrscht", fr: "Dieu a régné par le bois" }
  - { la: "arbor decora et fulgida", it: "Albero bello e splendente", en: "O tree, fair and shining", es: "Árbol hermoso y resplandeciente", de: "Schöner, leuchtender Baum", fr: "Arbre beau et resplendissant" }
  - { la: "ornata regis purpura", it: "ornato della porpora del Re", en: "adorned with the purple of the King", es: "adornado con la púrpura del Rey", de: "geschmückt mit dem Purpur des Königs", fr: "orné de la pourpre du Roi" }
  - { la: "electa digno stipite", it: "scelto, tronco degno", en: "chosen, a worthy trunk", es: "elegido, digno tronco", de: "erwählt, ein würdiger Stamm", fr: "choisi, tronc digne" }
  - { la: "tam sancta membra tangere", it: "di toccare membra così sante", en: "to touch limbs so holy", es: "de tocar miembros tan santos", de: "so heilige Glieder zu berühren", fr: "de toucher des membres si saints" }
  - { la: "beata cuius brachiis", it: "Beato, dalle cui braccia", en: "Blessed, on whose arms", es: "Bienaventurado, de cuyos brazos", de: "Selig, an dessen Armen", fr: "Bienheureux, aux bras duquel" }
  - { la: "pretium pependit saeculi", it: "fu appeso il riscatto del mondo", en: "hung the ransom of the world", es: "colgó el rescate del mundo", de: "das Lösegeld der Welt hing", fr: "fut suspendue la rançon du monde" }
  - { la: "statera facta corporis", it: "bilancia del suo corpo", en: "made the scales of his body", es: "hecho balanza de su cuerpo", de: "zur Waage seines Leibes geworden", fr: "devenu la balance de son corps" }
  - { la: "praedam tulitque tartari", alt: ["tulitque praedam tartari"], it: "ha strappato la preda agli inferi", en: "and carried off the prey of hell", es: "y arrebató la presa al infierno", de: "und der Hölle die Beute entriss", fr: "et ravi sa proie aux enfers" }
  - { la: "fundis aroma cortice", it: "Spandi aroma dalla corteccia", en: "You pour out fragrance from your bark", es: "Derramas aroma desde tu corteza", de: "Du verströmst Duft aus deiner Rinde", fr: "Tu répands un parfum par ton écorce" }
  - { la: "vincis sapore nectare", it: "vinci il nettare nel sapore", en: "you surpass nectar in taste", es: "superas al néctar en sabor", de: "du übertriffst den Nektar an Geschmack", fr: "tu surpasses le nectar en saveur" }
  - { la: "iucunda fructu fertili", it: "lieto di frutto fecondo", en: "joyful with fertile fruit", es: "gozoso de fruto fértil", de: "froh über reiche Frucht", fr: "joyeux d'un fruit fécond" }
  - { la: "plaudis triumpho nobili", it: "esulti per il nobile trionfo", en: "you applaud a noble triumph", es: "aplaudes un noble triunfo", de: "du jubelst über den edlen Triumph", fr: "tu applaudis à un noble triomphe" }
  - { la: "salve ara salve victima", it: "Salve, altare; salve, vittima", en: "Hail, altar; hail, victim", es: "Salve, altar; salve, víctima", de: "Sei gegrüßt, Altar; sei gegrüßt, Opfer", fr: "Salut, autel ; salut, victime" }
  - { la: "de passionis gloria", it: "per la gloria della passione", en: "for the glory of the passion", es: "por la gloria de la pasión", de: "um der Herrlichkeit der Passion willen", fr: "pour la gloire de la passion" }
  - { la: "qua vita mortem pertulit", it: "per cui la vita ha sopportato la morte", en: "by which life endured death", es: "por la cual la vida soportó la muerte", de: "durch die das Leben den Tod erduldete", fr: "par laquelle la vie a subi la mort" }
  - { la: "et morte vitam reddidit", alt: ["et morte vitam protulit"], it: "e con la morte ha ridato la vita", en: "and by death restored life", es: "y con la muerte devolvió la vida", de: "und durch den Tod das Leben zurückgab", fr: "et par la mort a rendu la vie" }
  - { la: "O Crux ave spes unica", it: "Ave, o Croce, unica speranza", en: "Hail, O Cross, our only hope", es: "Salve, oh Cruz, única esperanza", de: "Sei gegrüßt, o Kreuz, einzige Hoffnung", fr: "Salut, ô Croix, unique espérance" }
  - { la: "hoc passionis tempore", it: "in questo tempo di passione", en: "in this time of the passion", es: "en este tiempo de pasión", de: "in dieser Zeit der Passion", fr: "en ce temps de la passion" }
  - { la: "piis adauge gratiam", it: "accresci la grazia ai pii", en: "increase grace for the devout", es: "aumenta la gracia a los piadosos", de: "mehre den Frommen die Gnade", fr: "accrois la grâce des fidèles" }
  - { la: "reisque dele crimina", it: "e cancella le colpe dei colpevoli", en: "and blot out the sins of the guilty", es: "y borra los crímenes de los culpables", de: "und tilge die Verbrechen der Schuldigen", fr: "et efface les crimes des coupables" }
  - { la: "Auge piis iustitiam", it: "Accresci ai pii la giustizia", en: "Increase righteousness for the devout", es: "Aumenta a los piadosos la justicia", de: "Mehre den Frommen die Gerechtigkeit", fr: "Accrois chez les fidèles la justice" }
  - { la: "reisque dona veniam", it: "e concedi perdono ai colpevoli", en: "and grant pardon to the guilty", es: "y concede perdón a los culpables", de: "und gewähre den Schuldigen Verzeihung", fr: "et accorde le pardon aux coupables" }
  - { la: "Te fons salutis Trinitas", it: "Te, Trinità, fonte di salvezza", en: "You, Trinity, fountain of salvation", es: "A ti, Trinidad, fuente de salvación", de: "Dich, Dreifaltigkeit, Quell des Heils", fr: "Toi, Trinité, source du salut" }
  - { la: "Te summa Deus Trinitas", it: "Te, Trinità, Dio altissimo", en: "You, God, highest Trinity", es: "A ti, Dios, Trinidad suprema", de: "Dich, Gott, höchste Dreifaltigkeit", fr: "Toi, Dieu, Trinité très haute" }
  - { la: "collaudet omnis spiritus", it: "ti lodi ogni spirito", en: "let every spirit praise", es: "alabe todo espíritu", de: "lobe jeder Geist", fr: "que tout esprit te loue" }
  - { la: "quos per crucis mysterium", it: "quelli che con il mistero della croce", en: "those whom through the mystery of the cross", es: "a los que por el misterio de la cruz", de: "die du durch das Geheimnis des Kreuzes", fr: "ceux que par le mystère de la croix" }
  - { la: "salvas rege per saecula", alt: ["salvas fove per saecula"], it: "salvi, guidali per i secoli", en: "you save, guide them through the ages", es: "salvas, guíalos por los siglos", de: "rettest, leite sie durch die Zeiten", fr: "tu sauves, guide-les à travers les siècles" }
  - { la: "Quibus Crucis victoriam", it: "A coloro cui la vittoria della croce", en: "To those to whom the victory of the cross", es: "A aquellos a quienes la victoria de la cruz", de: "Denen du den Sieg des Kreuzes", fr: "À ceux à qui la victoire de la croix" }
  - { la: "largiris adde praemium", it: "concedi, aggiungi anche il premio", en: "you grant, add also the reward", es: "concedes, añade también el premio", de: "schenkst, füge auch den Lohn hinzu", fr: "tu accordes, ajoute aussi la récompense" }
  - { la: "Amen", it: "Amen", en: "Amen", es: "Amén", de: "Amen", fr: "Amen" }
