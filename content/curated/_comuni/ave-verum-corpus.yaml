  - { la: "O Iesu fili Mariae", it: "o Gesù, figlio di Maria", en: "O Jesus, son of Mary", es: "oh Jesús, hijo de María", de: "o Jesus, Sohn Marias", fr: "ô Jésus, fils de Marie" }
