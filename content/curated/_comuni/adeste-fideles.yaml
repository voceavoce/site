comune: adeste-fideles
credit: "Traduzione automatica (Claude), non rivista"
license: "CC0 1.0"
righe:
  - { la: "Adeste fideles laeti triumphantes", it: "Venite, fedeli, lieti e trionfanti", en: "Come, O faithful, joyful and triumphant", es: "Venid, fieles, alegres y triunfantes", de: "Kommt, ihr Gläubigen, froh und triumphierend", fr: "Venez, fidèles, joyeux et triomphants" }
  - { la: "venite venite in Bethlehem", it: "venite, venite a Betlemme", en: "come, come to Bethlehem", es: "venid, venid a Belén", de: "kommt, kommt nach Betlehem", fr: "venez, venez à Bethléem" }
  - { la: "Natum videte Regem angelorum", it: "Vedete nato il Re degli angeli", en: "See the newborn King of angels", es: "Ved nacido al Rey de los ángeles", de: "Seht den neugeborenen König der Engel", fr: "Voyez né le Roi des anges" }
  - { la: "Venite adoremus Dominum", it: "Venite, adoriamo il Signore", en: "Come, let us adore the Lord", es: "Venid, adoremos al Señor", de: "Kommt, lasst uns den Herrn anbeten", fr: "Venez, adorons le Seigneur" }
  - { la: "Venite adoremus", it: "Venite, adoriamo", en: "Come, let us adore", es: "Venid, adoremos", de: "Kommt, lasst uns anbeten", fr: "Venez, adorons" }
  - { la: "Dominum", it: "il Signore", en: "the Lord", es: "al Señor", de: "den Herrn", fr: "le Seigneur" }
  - { la: "Deum de Deo", it: "Dio da Dio", en: "God from God", es: "Dios de Dios", de: "Gott von Gott", fr: "Dieu né de Dieu" }
  - { la: "lumen de lumine", it: "luce da luce", en: "light from light", es: "luz de luz", de: "Licht vom Licht", fr: "lumière née de la lumière" }
  - { la: "Gestant puellae viscera", it: "porta il grembo di una fanciulla", en: "the womb of a maiden bears him", es: "lo lleva el seno de una doncella", de: "der Schoß einer Jungfrau trägt ihn", fr: "le sein d'une jeune fille le porte" }
  - { la: "Deum verum", it: "vero Dio", en: "true God", es: "Dios verdadero", de: "wahrer Gott", fr: "vrai Dieu" }
  - { la: "genitum non factum", it: "generato, non creato", en: "begotten, not made", es: "engendrado, no creado", de: "gezeugt, nicht geschaffen", fr: "engendré, non créé" }
  - { la: "En grege relicto humiles ad cunas", it: "Ecco, lasciato il gregge, ai piedi della culla", en: "See, leaving their flock, to the humble cradle", es: "Mirad, dejado el rebaño, a la humilde cuna", de: "Seht, die Herde verlassend, zur schlichten Krippe", fr: "Voici, laissant leur troupeau, à l'humble crèche" }
  - { la: "vocati pastores adproperant", alt: ["vocati pastores approperant"], it: "accorrono i pastori chiamati", en: "the called shepherds hasten", es: "acuden los pastores llamados", de: "eilen die gerufenen Hirten", fr: "accourent les bergers appelés" }
  - { la: "et nos ovanti gradu festinemus", it: "e noi con passo esultante affrettiamoci", en: "and let us hasten with joyful steps", es: "y nosotros con paso alegre apresurémonos", de: "und auch wir wollen mit frohem Schritt eilen", fr: "et nous, d'un pas joyeux, hâtons-nous" }
  - { la: "Stella duce Magi Christum adorantes", it: "Guidati dalla stella, i Magi adorano Cristo", en: "Led by the star, the Magi adore Christ", es: "Guiados por la estrella, los Magos adoran a Cristo", de: "Vom Stern geleitet, beten die Weisen Christus an", fr: "Guidés par l'étoile, les Mages adorent le Christ" }
  - { la: "aurum tus et myrrham dant munera", it: "oro, incenso e mirra sono i loro doni", en: "gold, frankincense and myrrh they give as gifts", es: "oro, incienso y mirra ofrecen como dones", de: "Gold, Weihrauch und Myrrhe bringen sie als Gaben", fr: "or, encens et myrrhe, ils offrent leurs présents" }
  - { la: "Iesu infanti corda praebeamus", it: "Offriamo i nostri cuori a Gesù bambino", en: "Let us offer our hearts to the child Jesus", es: "Ofrezcamos nuestros corazones al niño Jesús", de: "Bieten wir dem Jesuskind unsere Herzen", fr: "Offrons nos cœurs à l'enfant Jésus" }
  - { la: "Aeterni Parentis splendorem aeternum", it: "Lo splendore eterno dell'eterno Padre", en: "The eternal splendor of the eternal Father", es: "El esplendor eterno del Padre eterno", de: "Den ewigen Glanz des ewigen Vaters", fr: "La splendeur éternelle du Père éternel" }
  - { la: "velatum sub carne videbimus", it: "vedremo velato sotto la carne", en: "we shall see veiled beneath flesh", es: "veremos velado bajo la carne", de: "werden wir unter dem Fleisch verhüllt sehen", fr: "nous le verrons voilé sous la chair" }
  - { la: "Deum infantem pannis involutum", it: "Dio bambino avvolto in fasce", en: "God as an infant wrapped in swaddling clothes", es: "Dios niño envuelto en pañales", de: "Gott als Kind, in Windeln gewickelt", fr: "Dieu enfant enveloppé de langes" }
  - { la: "Pro nobis egenum et faeno cubantem", alt: ["Pro nobis egenum et foeno cubantem"], it: "Povero per noi e adagiato sul fieno", en: "Poor for our sake and lying on the hay", es: "Pobre por nosotros y recostado en el heno", de: "Für uns arm und auf Heu gebettet", fr: "Pauvre pour nous et couché sur le foin" }
  - { la: "piis foveamus amplexibus", it: "scaldiamolo con pii abbracci", en: "let us warm him with loving embraces", es: "abriguémoslo con piadosos abrazos", de: "wärmen wir ihn mit frommen Umarmungen", fr: "réchauffons-le de pieuses étreintes" }
  - { la: "Sic nos amantem quis non redamaret", it: "Chi non amerebbe a sua volta colui che ci ama così?", en: "Who would not love in return one who loves us so?", es: "¿Quién no amaría a quien así nos ama?", de: "Wer sollte den nicht wieder lieben, der uns so liebt?", fr: "Qui n'aimerait en retour celui qui nous aime ainsi ?" }
  - { la: "Cantet nunc io chorus angelorum", it: "Canti ora in giubilo il coro degli angeli", en: "Now let the choir of angels sing out", es: "Cante ahora con júbilo el coro de los ángeles", de: "Nun jauchze der Chor der Engel", fr: "Que chante maintenant en joie le chœur des anges" }
  - { la: "Cantet nunc aula caelestium", it: "canti ora la corte celeste", en: "now let the court of heaven sing", es: "cante ahora la corte celestial", de: "nun singe der himmlische Hofstaat", fr: "que chante maintenant la cour céleste" }
  - { la: "Gloria in excelsis Deo", alt: ["Gloria gloria in excelsis Deo"], it: "Gloria a Dio nell'alto dei cieli", en: "Glory to God in the highest", es: "Gloria a Dios en las alturas", de: "Ehre sei Gott in der Höhe", fr: "Gloire à Dieu au plus haut des cieux" }
  - { la: "Ergo qui natus die hodierna", it: "A te dunque, che sei nato in questo giorno", en: "To you, then, who were born this day", es: "A ti, pues, que has nacido en este día", de: "Dir also, der du heute geboren bist", fr: "À toi donc, qui es né en ce jour" }
  - { la: "Iesu tibi sit gloria", it: "o Gesù, sia gloria", en: "O Jesus, be glory", es: "oh Jesús, sea la gloria", de: "o Jesus, sei Ehre", fr: "ô Jésus, gloire à toi" }
  - { la: "Patris aeterni Verbum caro factum", it: "Verbo del Padre eterno, fatto carne", en: "Word of the eternal Father made flesh", es: "Verbo del Padre eterno hecho carne", de: "Wort des ewigen Vaters, Fleisch geworden", fr: "Verbe du Père éternel fait chair" }
