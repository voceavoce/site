comune: credo
credit: "Traduzione automatica (Claude), non rivista"
license: "CC0 1.0"
righe:
  - { la: "Credo in unum Deum", it: "Credo in un solo Dio", en: "I believe in one God", es: "Creo en un solo Dios", de: "Ich glaube an den einen Gott", fr: "Je crois en un seul Dieu" }
  - { la: "Patrem omnipotentem", it: "Padre onnipotente", en: "the Father almighty", es: "Padre todopoderoso", de: "den allmächtigen Vater", fr: "le Père tout-puissant" }
  - { la: "factorem caeli et terrae", it: "creatore del cielo e della terra", en: "maker of heaven and earth", es: "creador del cielo y de la tierra", de: "Schöpfer des Himmels und der Erde", fr: "créateur du ciel et de la terre" }
  - { la: "visibilium omnium et invisibilium", it: "di tutte le cose visibili e invisibili", en: "of all things visible and invisible", es: "de todo lo visible y lo invisible", de: "alles Sichtbaren und Unsichtbaren", fr: "de toutes les choses visibles et invisibles" }
  - { la: "Et in unum Dominum Iesum Christum", it: "E in un solo Signore, Gesù Cristo", en: "And in one Lord, Jesus Christ", es: "Y en un solo Señor, Jesucristo", de: "Und an den einen Herrn, Jesus Christus", fr: "Et en un seul Seigneur, Jésus-Christ" }
  - { la: "Filium Dei unigenitum", it: "Figlio unigenito di Dio", en: "the only-begotten Son of God", es: "Hijo unigénito de Dios", de: "Gottes eingeborenen Sohn", fr: "Fils unique de Dieu" }
  - { la: "et ex Patre natum ante omnia saecula", it: "nato dal Padre prima di tutti i secoli", en: "born of the Father before all ages", es: "nacido del Padre antes de todos los siglos", de: "aus dem Vater geboren vor aller Zeit", fr: "né du Père avant tous les siècles" }
  - { la: "Deum de Deo", it: "Dio da Dio", en: "God from God", es: "Dios de Dios", de: "Gott von Gott", fr: "Dieu né de Dieu" }
  - { la: "lumen de lumine", it: "luce da luce", en: "light from light", es: "luz de luz", de: "Licht vom Licht", fr: "lumière née de la lumière" }
  - { la: "Deum verum de Deo vero", it: "Dio vero da Dio vero", en: "true God from true God", es: "Dios verdadero de Dios verdadero", de: "wahrer Gott vom wahren Gott", fr: "vrai Dieu né du vrai Dieu" }
  - { la: "genitum non factum", it: "generato, non creato", en: "begotten, not made", es: "engendrado, no creado", de: "gezeugt, nicht geschaffen", fr: "engendré, non créé" }
  - { la: "consubstantialem Patri", it: "della stessa sostanza del Padre", en: "of one substance with the Father", es: "de la misma sustancia del Padre", de: "wesensgleich mit dem Vater", fr: "de même substance que le Père" }
  - { la: "per quem omnia facta sunt", it: "per mezzo di lui tutte le cose sono state create", en: "through him all things were made", es: "por quien todo fue hecho", de: "durch ihn ist alles geschaffen", fr: "par lui tout a été fait" }
  - { la: "Qui propter nos homines et propter nostram salutem", it: "Per noi uomini e per la nostra salvezza", en: "For us men and for our salvation", es: "Por nosotros los hombres y por nuestra salvación", de: "Für uns Menschen und um unseres Heiles willen", fr: "Pour nous les hommes et pour notre salut" }
  - { la: "descendit de caelis", it: "discese dal cielo", en: "he came down from heaven", es: "bajó del cielo", de: "ist er vom Himmel herabgestiegen", fr: "il descendit du ciel" }
  - { la: "Et incarnatus est de Spiritu Sancto", it: "E si è incarnato per opera dello Spirito Santo", en: "And was made flesh by the Holy Spirit", es: "Y se encarnó por obra del Espíritu Santo", de: "Und ist Fleisch geworden durch den Heiligen Geist", fr: "Et s'est incarné par l'Esprit Saint" }
  - { la: "ex Maria Virgine", it: "da Maria Vergine", en: "of the Virgin Mary", es: "de María la Virgen", de: "aus der Jungfrau Maria", fr: "de la Vierge Marie" }
  - { la: "et homo factus est", it: "e si è fatto uomo", en: "and became man", es: "y se hizo hombre", de: "und ist Mensch geworden", fr: "et s'est fait homme" }
  - { la: "Crucifixus etiam pro nobis sub Pontio Pilato", it: "Fu crocifisso anche per noi sotto Ponzio Pilato", en: "He was crucified also for us under Pontius Pilate", es: "Fue crucificado también por nosotros bajo Poncio Pilato", de: "Er wurde auch für uns gekreuzigt unter Pontius Pilatus", fr: "Il fut crucifié aussi pour nous sous Ponce Pilate" }
  - { la: "passus et sepultus est", it: "morì e fu sepolto", en: "he suffered and was buried", es: "padeció y fue sepultado", de: "hat gelitten und wurde begraben", fr: "il souffrit et fut mis au tombeau" }
  - { la: "et resurrexit tertia die", it: "e il terzo giorno è risorto", en: "and on the third day he rose again", es: "y resucitó al tercer día", de: "und ist am dritten Tag auferstanden", fr: "et ressuscita le troisième jour" }
  - { la: "secundum Scripturas", it: "secondo le Scritture", en: "according to the Scriptures", es: "según las Escrituras", de: "gemäß der Schrift", fr: "selon les Écritures" }
  - { la: "et ascendit in caelum", alt: ["et ascendit in coelum"], it: "è salito al cielo", en: "and ascended into heaven", es: "y subió al cielo", de: "und ist aufgefahren in den Himmel", fr: "et monta au ciel" }
  - { la: "sedet ad dexteram Patris", it: "siede alla destra del Padre", en: "he sits at the right hand of the Father", es: "está sentado a la derecha del Padre", de: "er sitzt zur Rechten des Vaters", fr: "il siège à la droite du Père" }
  - { la: "Et iterum venturus est cum gloria", it: "E di nuovo verrà con gloria", en: "And he will come again with glory", es: "Y de nuevo vendrá con gloria", de: "Und er wird wiederkommen in Herrlichkeit", fr: "Et il reviendra dans la gloire" }
  - { la: "iudicare vivos et mortuos", it: "per giudicare i vivi e i morti", en: "to judge the living and the dead", es: "para juzgar a vivos y muertos", de: "um die Lebenden und die Toten zu richten", fr: "pour juger les vivants et les morts" }
  - { la: "cuius regni non erit finis", it: "e il suo regno non avrà fine", en: "and his kingdom will have no end", es: "y su reino no tendrá fin", de: "und seines Reiches wird kein Ende sein", fr: "et son règne n'aura pas de fin" }
  - { la: "Et in Spiritum Sanctum", it: "E nello Spirito Santo", en: "And in the Holy Spirit", es: "Y en el Espíritu Santo", de: "Und an den Heiligen Geist", fr: "Et en l'Esprit Saint" }
  - { la: "Dominum et vivificantem", it: "Signore che dà la vita", en: "the Lord and giver of life", es: "Señor y dador de vida", de: "den Herrn und Lebensspender", fr: "Seigneur qui donne la vie" }
  - { la: "qui ex Patre Filioque procedit", it: "che procede dal Padre e dal Figlio", en: "who proceeds from the Father and the Son", es: "que procede del Padre y del Hijo", de: "der vom Vater und vom Sohn ausgeht", fr: "qui procède du Père et du Fils" }
  - { la: "Qui cum Patre et Filio simul adoratur et conglorificatur", it: "Con il Padre e il Figlio è adorato e glorificato insieme", en: "With the Father and the Son he is together adored and glorified", es: "Con el Padre y el Hijo es juntamente adorado y glorificado", de: "Mit dem Vater und dem Sohn wird er zugleich angebetet und verherrlicht", fr: "Avec le Père et le Fils il est ensemble adoré et glorifié" }
  - { la: "qui locutus est per prophetas", it: "e ha parlato per mezzo dei profeti", en: "who has spoken through the prophets", es: "que habló por los profetas", de: "der gesprochen hat durch die Propheten", fr: "qui a parlé par les prophètes" }
  - { la: "Et unam sanctam catholicam et apostolicam Ecclesiam", it: "E in una Chiesa santa, cattolica e apostolica", en: "And in one holy, catholic and apostolic Church", es: "Y en una sola Iglesia santa, católica y apostólica", de: "Und an die eine, heilige, katholische und apostolische Kirche", fr: "Et en une seule Église, sainte, catholique et apostolique" }
  - { la: "Confiteor unum baptisma in remissionem peccatorum", it: "Professo un solo battesimo per il perdono dei peccati", en: "I confess one baptism for the forgiveness of sins", es: "Confieso un solo bautismo para el perdón de los pecados", de: "Ich bekenne die eine Taufe zur Vergebung der Sünden", fr: "Je confesse un seul baptême pour le pardon des péchés" }
  - { la: "Et exspecto resurrectionem mortuorum", alt: ["Et expecto resurrectionem mortuorum"], it: "E aspetto la risurrezione dei morti", en: "And I await the resurrection of the dead", es: "Y espero la resurrección de los muertos", de: "Und ich erwarte die Auferstehung der Toten", fr: "Et j'attends la résurrection des morts" }
  - { la: "et vitam venturi saeculi", it: "e la vita del mondo che verrà", en: "and the life of the world to come", es: "y la vida del siglo futuro", de: "und das Leben der kommenden Welt", fr: "et la vie du siècle à venir" }
  - { la: "Amen", it: "Amen", en: "Amen", es: "Amén", de: "Amen", fr: "Amen" }
