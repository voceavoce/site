comune: te-deum
credit: "Traduzione automatica (Claude), non rivista"
license: "CC0 1.0"
righe:
  - { la: "Te Deum laudamus", it: "Noi ti lodiamo, o Dio", en: "We praise you, O God", es: "A ti, Dios, te alabamos", de: "Dich, Gott, loben wir", fr: "Nous te louons, ô Dieu" }
  - { la: "te Dominum confitemur", it: "ti proclamiamo Signore", en: "we acknowledge you as Lord", es: "te confesamos Señor", de: "dich, den Herrn, bekennen wir", fr: "nous te confessons Seigneur" }
  - { la: "Te aeternum Patrem", it: "Te, Padre eterno", en: "You, the eternal Father", es: "A ti, Padre eterno", de: "Dich, den ewigen Vater", fr: "Toi, le Père éternel" }
  - { la: "omnis terra veneratur", it: "tutta la terra venera", en: "all the earth worships", es: "toda la tierra venera", de: "verehrt die ganze Erde", fr: "toute la terre te vénère" }
  - { la: "Tibi omnes angeli", it: "A te tutti gli angeli", en: "To you all the angels", es: "A ti todos los ángeles", de: "Dir alle Engel", fr: "À toi tous les anges" }
  - { la: "tibi caeli et universae potestates", it: "a te i cieli e tutte le potenze", en: "to you the heavens and all the powers", es: "a ti los cielos y todas las potestades", de: "dir die Himmel und alle Mächte", fr: "à toi les cieux et toutes les puissances" }
  - { la: "tibi cherubim et seraphim", it: "a te i cherubini e i serafini", en: "to you the cherubim and seraphim", es: "a ti los querubines y serafines", de: "dir die Cherubim und Seraphim", fr: "à toi les chérubins et les séraphins" }
  - { la: "incessabili voce proclamant", it: "con incessante voce acclamano", en: "with unceasing voice proclaim", es: "con incesante voz proclaman", de: "rufen mit unablässiger Stimme", fr: "proclament d'une voix incessante" }
  - { la: "Sanctus Sanctus Sanctus", it: "Santo, Santo, Santo", en: "Holy, Holy, Holy", es: "Santo, Santo, Santo", de: "Heilig, heilig, heilig", fr: "Saint, Saint, Saint" }
  - { la: "Dominus Deus Sabaoth", it: "Signore Dio dell'universo", en: "Lord God of hosts", es: "Señor Dios del universo", de: "Herr, Gott der Heerscharen", fr: "Seigneur, Dieu de l'univers" }
  - { la: "Pleni sunt caeli et terra", it: "I cieli e la terra sono pieni", en: "Heaven and earth are full", es: "Llenos están el cielo y la tierra", de: "Himmel und Erde sind erfüllt", fr: "Le ciel et la terre sont remplis" }
  - { la: "maiestatis gloriae tuae", it: "della maestà della tua gloria", en: "of the majesty of your glory", es: "de la majestad de tu gloria", de: "von der Majestät deiner Herrlichkeit", fr: "de la majesté de ta gloire" }
  - { la: "Te gloriosus apostolorum chorus", it: "Te, il glorioso coro degli apostoli", en: "You, the glorious choir of the apostles", es: "A ti, el glorioso coro de los apóstoles", de: "Dich, der ruhmreiche Chor der Apostel", fr: "Toi, le chœur glorieux des apôtres" }
  - { la: "te prophetarum laudabilis numerus", it: "te, la lodevole schiera dei profeti", en: "you, the praiseworthy company of the prophets", es: "a ti, el laudable número de los profetas", de: "dich, die lobwürdige Schar der Propheten", fr: "toi, l'admirable troupe des prophètes" }
  - { la: "te martyrum candidatus laudat exercitus", it: "te, il candido esercito dei martiri, loda", en: "you, the white-robed army of martyrs praises", es: "a ti, el cándido ejército de los mártires, alaba", de: "dich lobt das weiß gekleidete Heer der Märtyrer", fr: "toi, l'armée éclatante des martyrs te loue" }
  - { la: "Te per orbem terrarum", it: "Te per tutta la terra", en: "You throughout the whole world", es: "A ti por toda la tierra", de: "Dich über den ganzen Erdkreis hin", fr: "Toi, par toute la terre" }
  - { la: "sancta confitetur Ecclesia", it: "la santa Chiesa proclama", en: "the holy Church acknowledges", es: "la santa Iglesia confiesa", de: "bekennt die heilige Kirche", fr: "la sainte Église te confesse" }
  - { la: "Patrem immensae maiestatis", it: "Padre di immensa maestà", en: "Father of boundless majesty", es: "Padre de inmensa majestad", de: "Vater unermesslicher Majestät", fr: "Père d'une majesté immense" }
  - { la: "venerandum tuum verum et unicum Filium", it: "venerando tuo vero e unico Figlio", en: "your adorable, true and only Son", es: "tu venerable, verdadero y único Hijo", de: "deinen anbetungswürdigen, wahren und einzigen Sohn", fr: "ton Fils vénérable, véritable et unique" }
  - { la: "Sanctum quoque Paraclitum Spiritum", it: "e anche lo Spirito Santo Paraclito", en: "and the Holy Spirit, the Paraclete", es: "y también al Espíritu Santo Paráclito", de: "und auch den Heiligen Geist, den Beistand", fr: "et aussi l'Esprit Saint Consolateur" }
  - { la: "Tu rex gloriae Christe", it: "Tu, Re della gloria, o Cristo", en: "You are the King of glory, O Christ", es: "Tú eres el Rey de la gloria, Cristo", de: "Du bist der König der Herrlichkeit, Christus", fr: "Tu es le Roi de gloire, ô Christ" }
  - { la: "Tu Patris sempiternus es Filius", it: "Tu sei il Figlio eterno del Padre", en: "You are the everlasting Son of the Father", es: "Tú eres el Hijo eterno del Padre", de: "Du bist der ewige Sohn des Vaters", fr: "Tu es le Fils éternel du Père" }
  - { la: "Tu ad liberandum suscepturus hominem", it: "Tu, per liberare l'uomo, stavi per assumerlo", en: "To set mankind free, you took on our nature", es: "Tú, para liberar al hombre, te dispusiste a asumirlo", de: "Du, um den Menschen zu befreien, nahmst ihn an", fr: "Toi, pour libérer l'homme, tu as pris notre nature" }
  - { la: "non horruisti Virginis uterum", it: "non hai disdegnato il grembo di una Vergine", en: "you did not shrink from the Virgin's womb", es: "no desdeñaste el seno de una Virgen", de: "und scheutest nicht den Schoß der Jungfrau", fr: "tu n'as pas dédaigné le sein de la Vierge" }
  - { la: "Tu devicto mortis aculeo", it: "Tu, vinto il pungiglione della morte", en: "You, having overcome the sting of death", es: "Tú, vencido el aguijón de la muerte", de: "Du, nachdem du den Stachel des Todes besiegt", fr: "Toi, ayant vaincu l'aiguillon de la mort" }
  - { la: "aperuisti credentibus regna caelorum", it: "hai aperto ai credenti il regno dei cieli", en: "opened the kingdom of heaven to believers", es: "abriste a los creyentes el reino de los cielos", de: "hast den Gläubigen das Himmelreich geöffnet", fr: "as ouvert aux croyants le royaume des cieux" }
  - { la: "Tu ad dexteram Dei sedes", it: "Tu siedi alla destra di Dio", en: "You sit at the right hand of God", es: "Tú te sientas a la derecha de Dios", de: "Du sitzest zur Rechten Gottes", fr: "Tu sièges à la droite de Dieu" }
  - { la: "in gloria Patris", it: "nella gloria del Padre", en: "in the glory of the Father", es: "en la gloria del Padre", de: "in der Herrlichkeit des Vaters", fr: "dans la gloire du Père" }
  - { la: "Iudex crederis esse venturus", it: "Crediamo che verrai come giudice", en: "We believe that you will come as our judge", es: "Creemos que vendrás como juez", de: "Wir glauben, dass du als Richter kommen wirst", fr: "Nous croyons que tu viendras comme juge" }
  - { la: "Te ergo quaesumus", it: "Ti preghiamo dunque", en: "We therefore pray you", es: "Te rogamos, pues", de: "Wir bitten dich also", fr: "Nous te prions donc" }
  - { la: "tuis famulis subveni", it: "vieni in aiuto ai tuoi servi", en: "come to the help of your servants", es: "socorre a tus siervos", de: "komm deinen Dienern zu Hilfe", fr: "viens au secours de tes serviteurs" }
  - { la: "quos pretioso sanguine redemisti", it: "che hai redento con il tuo sangue prezioso", en: "whom you redeemed with your precious blood", es: "a quienes redimiste con tu sangre preciosa", de: "die du mit deinem kostbaren Blut erlöst hast", fr: "que tu as rachetés par ton sang précieux" }
  - { la: "Aeterna fac cum sanctis tuis", it: "Fa' che siano accolti con i tuoi santi", en: "Make them to be numbered with your saints", es: "Haz que sean contados con tus santos", de: "Lass sie mit deinen Heiligen zählen", fr: "Fais-les compter avec tes saints" }
  - { la: "in gloria numerari", it: "nella gloria eterna", en: "in everlasting glory", es: "en la gloria eterna", de: "in der ewigen Herrlichkeit", fr: "dans la gloire éternelle" }
  - { la: "Salvum fac populum tuum Domine", it: "Salva il tuo popolo, Signore", en: "Save your people, O Lord", es: "Salva a tu pueblo, Señor", de: "Rette dein Volk, Herr", fr: "Sauve ton peuple, Seigneur" }
  - { la: "et benedic hereditati tuae", it: "e benedici la tua eredità", en: "and bless your inheritance", es: "y bendice tu heredad", de: "und segne dein Erbe", fr: "et bénis ton héritage" }
  - { la: "Et rege eos et extolle illos", it: "Guidali ed esaltali", en: "Govern them and raise them up", es: "Gobiérnalos y enaltécelos", de: "Leite sie und erhebe sie", fr: "Conduis-les et élève-les" }
  - { la: "usque in aeternum", it: "per sempre", en: "forever", es: "para siempre", de: "bis in Ewigkeit", fr: "pour toujours" }
  - { la: "Per singulos dies benedicimus te", it: "Ogni giorno ti benediciamo", en: "Every day we bless you", es: "Cada día te bendecimos", de: "Jeden Tag preisen wir dich", fr: "Chaque jour nous te bénissons" }
  - { la: "et laudamus nomen tuum", it: "e lodiamo il tuo nome", en: "and we praise your name", es: "y alabamos tu nombre", de: "und loben deinen Namen", fr: "et nous louons ton nom" }
  - { la: "in saeculum et in saeculum saeculi", it: "per sempre e nei secoli dei secoli", en: "for ever and for ever and ever", es: "por siempre y por los siglos de los siglos", de: "auf ewig und in alle Ewigkeit", fr: "à jamais et pour les siècles des siècles" }
  - { la: "Dignare Domine", it: "Degnati, Signore", en: "Deign, O Lord", es: "Dígnate, Señor", de: "Würdige dich, Herr", fr: "Daigne, Seigneur" }
  - { la: "die isto sine peccato nos custodire", it: "di custodirci in questo giorno senza peccato", en: "to keep us this day without sin", es: "de guardarnos en este día sin pecado", de: "uns an diesem Tag ohne Sünde zu bewahren", fr: "de nous garder en ce jour sans péché" }
  - { la: "Miserere nostri Domine miserere nostri", it: "Abbi pietà di noi, Signore, abbi pietà di noi", en: "Have mercy on us, O Lord, have mercy on us", es: "Ten piedad de nosotros, Señor, ten piedad de nosotros", de: "Erbarme dich unser, Herr, erbarme dich unser", fr: "Prends pitié de nous, Seigneur, prends pitié de nous" }
  - { la: "Fiat misericordia tua Domine super nos", it: "Sia su di noi, Signore, la tua misericordia", en: "Let your mercy be upon us, O Lord", es: "Sea tu misericordia sobre nosotros, Señor", de: "Deine Barmherzigkeit, Herr, komme über uns", fr: "Que ta miséricorde, Seigneur, soit sur nous" }
  - { la: "quemadmodum speravimus in te", it: "come abbiamo sperato in te", en: "as we have hoped in you", es: "como hemos esperado en ti", de: "wie wir auf dich gehofft haben", fr: "comme nous avons espéré en toi" }
  - { la: "In te Domine speravi", it: "In te, Signore, ho sperato", en: "In you, O Lord, I have hoped", es: "En ti, Señor, he esperado", de: "Auf dich, Herr, habe ich gehofft", fr: "En toi, Seigneur, j'ai espéré" }
  - { la: "non confundar in aeternum", it: "non sarò confuso in eterno", en: "let me never be put to shame", es: "no seré confundido jamás", de: "ich werde in Ewigkeit nicht zuschanden", fr: "je ne serai jamais confondu" }
