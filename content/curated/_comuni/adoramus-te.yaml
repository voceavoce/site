comune: adoramus-te
credit: "Traduzione automatica (Claude), non rivista"
license: "CC0 1.0"
righe:
  - { la: "Adoramus te sanctissime Domine Iesu Christe", it: "Ti adoriamo, santissimo Signore Gesù Cristo", en: "We adore you, most holy Lord Jesus Christ", es: "Te adoramos, santísimo Señor Jesucristo", de: "Wir beten dich an, heiligster Herr Jesus Christus", fr: "Nous t'adorons, très saint Seigneur Jésus-Christ" }
  - { la: "Adoramus te Christe", it: "Ti adoriamo, o Cristo", en: "We adore you, O Christ", es: "Te adoramos, Cristo", de: "Wir beten dich an, Christus", fr: "Nous t'adorons, ô Christ" }
  - { la: "et benedicimus tibi", it: "e ti benediciamo", en: "and we bless you", es: "y te bendecimos", de: "und wir preisen dich", fr: "et nous te bénissons" }
  - { la: "quia per sanguinem tuum pretiosum", it: "perché con il tuo sangue prezioso", en: "because by your precious blood", es: "porque con tu preciosa sangre", de: "denn durch dein kostbares Blut", fr: "car par ton sang précieux" }
  - { la: "quia per sanctam crucem tuam", it: "perché con la tua santa croce", en: "because by your holy cross", es: "porque con tu santa cruz", de: "denn durch dein heiliges Kreuz", fr: "car par ta sainte croix" }
  - { la: "redemisti mundum", it: "hai redento il mondo", en: "you have redeemed the world", es: "has redimido al mundo", de: "hast du die Welt erlöst", fr: "tu as racheté le monde" }
  - { la: "miserere nobis", it: "abbi pietà di noi", en: "have mercy on us", es: "ten piedad de nosotros", de: "erbarme dich unser", fr: "prends pitié de nous" }
  - { la: "Qui passus es pro nobis", it: "Tu che hai sofferto per noi", en: "You who suffered for us", es: "Tú que padeciste por nosotros", de: "Du, der für uns gelitten hat", fr: "Toi qui as souffert pour nous" }
  - { la: "Domine", it: "Signore", en: "Lord", es: "Señor", de: "Herr", fr: "Seigneur" }
  - { la: "hic et ad omnes Ecclesias tuas", it: "qui e in tutte le tue Chiese", en: "here and in all your Churches", es: "aquí y en todas tus Iglesias", de: "hier und in allen deinen Kirchen", fr: "ici et dans toutes tes Églises" }
  - { la: "quae sunt in toto mundo", it: "che sono in tutto il mondo", en: "that are in the whole world", es: "que hay en todo el mundo", de: "die es in der ganzen Welt gibt", fr: "qui sont dans le monde entier" }
  - { la: "Amen", it: "Amen", en: "Amen", es: "Amén", de: "Amen", fr: "Amen" }
