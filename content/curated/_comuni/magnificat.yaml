comune: magnificat
credit: "Traduzione automatica (Claude), non rivista"
license: "CC0 1.0"
righe:
  - { la: "Magnificat anima mea Dominum", it: "L'anima mia magnifica il Signore", en: "My soul magnifies the Lord", es: "Mi alma engrandece al Señor", de: "Meine Seele preist den Herrn", fr: "Mon âme exalte le Seigneur" }
  - { la: "et exsultavit spiritus meus", alt: ["et exultavit spiritus meus"], it: "e il mio spirito esulta", en: "and my spirit rejoices", es: "y mi espíritu se alegra", de: "und mein Geist jubelt", fr: "et mon esprit exulte" }
  - { la: "in Deo salutari meo", alt: ["in Deo salvatore meo"], it: "in Dio, mio salvatore", en: "in God my savior", es: "en Dios, mi salvador", de: "in Gott, meinem Retter", fr: "en Dieu, mon sauveur" }
  - { la: "quia respexit humilitatem ancillae suae", it: "perché ha guardato l'umiltà della sua serva", en: "for he has regarded the lowliness of his handmaid", es: "porque ha mirado la humildad de su sierva", de: "denn er hat auf die Niedrigkeit seiner Magd geschaut", fr: "car il a regardé l'humilité de sa servante" }
  - { la: "Ecce enim ex hoc beatam me dicent omnes generationes", it: "Ecco, d'ora in poi tutte le generazioni mi chiameranno beata", en: "Behold, from now on all generations will call me blessed", es: "He aquí que desde ahora me llamarán bienaventurada todas las generaciones", de: "Siehe, von nun an preisen mich selig alle Geschlechter", fr: "Voici que désormais toutes les générations me diront bienheureuse" }
  - { la: "quia fecit mihi magna qui potens est", it: "perché grandi cose ha fatto per me il Potente", en: "for the Mighty One has done great things for me", es: "porque ha hecho grandes cosas por mí el Poderoso", de: "denn der Mächtige hat Großes an mir getan", fr: "car le Puissant a fait pour moi de grandes choses" }
  - { la: "et sanctum nomen eius", it: "e santo è il suo nome", en: "and holy is his name", es: "y santo es su nombre", de: "und heilig ist sein Name", fr: "et saint est son nom" }
  - { la: "et misericordia eius in progenies et progenies", it: "e la sua misericordia di generazione in generazione", en: "and his mercy is from generation to generation", es: "y su misericordia de generación en generación", de: "und seine Barmherzigkeit währt von Geschlecht zu Geschlecht", fr: "et sa miséricorde s'étend de génération en génération" }
  - { la: "timentibus eum", it: "per quelli che lo temono", en: "on those who fear him", es: "para los que le temen", de: "über die, die ihn fürchten", fr: "sur ceux qui le craignent" }
  - { la: "Fecit potentiam in brachio suo", it: "Ha spiegato la potenza del suo braccio", en: "He has shown strength with his arm", es: "Ha hecho proezas con su brazo", de: "Er übt Macht aus mit seinem Arm", fr: "Il a déployé la force de son bras" }
  - { la: "dispersit superbos mente cordis sui", alt: ["dispersit superbos mente cordi sui"], it: "ha disperso i superbi nei pensieri del loro cuore", en: "he has scattered the proud in the thoughts of their hearts", es: "ha dispersado a los soberbios en los pensamientos de su corazón", de: "er zerstreut, die im Herzen voll Hochmut sind", fr: "il a dispersé les superbes dans les pensées de leur cœur" }
  - { la: "deposuit potentes de sede", it: "ha rovesciato i potenti dai troni", en: "he has put down the mighty from their seats", es: "ha derribado a los poderosos de sus tronos", de: "er stürzt die Mächtigen vom Thron", fr: "il a renversé les puissants de leurs trônes" }
  - { la: "et exaltavit humiles", it: "e ha innalzato gli umili", en: "and has exalted the lowly", es: "y ha exaltado a los humildes", de: "und erhöht die Niedrigen", fr: "et il a élevé les humbles" }
  - { la: "esurientes implevit bonis", it: "ha colmato di beni gli affamati", en: "he has filled the hungry with good things", es: "a los hambrientos los ha colmado de bienes", de: "die Hungernden beschenkt er mit Gütern", fr: "il a comblé de biens les affamés" }
  - { la: "et divites dimisit inanes", it: "e ha rimandato i ricchi a mani vuote", en: "and has sent the rich away empty", es: "y a los ricos los despidió vacíos", de: "und lässt die Reichen leer ausgehen", fr: "et il a renvoyé les riches les mains vides" }
  - { la: "Suscepit Israel puerum suum", it: "Ha soccorso Israele, suo servo", en: "He has helped Israel his servant", es: "Ha auxiliado a Israel, su siervo", de: "Er hat sich seines Knechtes Israel angenommen", fr: "Il a secouru Israël, son serviteur" }
  - { la: "recordatus misericordiae suae", it: "ricordandosi della sua misericordia", en: "remembering his mercy", es: "acordándose de su misericordia", de: "und denkt an sein Erbarmen", fr: "se souvenant de sa miséricorde" }
  - { la: "sicut locutus est ad patres nostros", it: "come aveva promesso ai nostri padri", en: "as he promised to our fathers", es: "como había prometido a nuestros padres", de: "wie er unseren Vätern versprochen hat", fr: "comme il l'avait promis à nos pères" }
  - { la: "Abraham et semini eius in saecula", it: "ad Abramo e alla sua discendenza per sempre", en: "to Abraham and his descendants forever", es: "a Abrahán y a su descendencia para siempre", de: "Abraham und seinen Nachkommen auf ewig", fr: "à Abraham et à sa descendance pour toujours" }
  - { la: "Gloria Patri et Filio", it: "Gloria al Padre e al Figlio", en: "Glory to the Father and to the Son", es: "Gloria al Padre y al Hijo", de: "Ehre sei dem Vater und dem Sohn", fr: "Gloire au Père et au Fils" }
  - { la: "et Spiritui Sancto", it: "e allo Spirito Santo", en: "and to the Holy Spirit", es: "y al Espíritu Santo", de: "und dem Heiligen Geist", fr: "et au Saint-Esprit" }
  - { la: "Sicut erat in principio", it: "Come era in principio", en: "As it was in the beginning", es: "Como era en el principio", de: "Wie es war im Anfang", fr: "Comme il était au commencement" }
  - { la: "et nunc et semper", it: "e ora e sempre", en: "is now and ever shall be", es: "ahora y siempre", de: "so auch jetzt und allezeit", fr: "maintenant et toujours" }
  - { la: "et in saecula saeculorum", it: "e nei secoli dei secoli", en: "world without end", es: "y por los siglos de los siglos", de: "und in alle Ewigkeit", fr: "et dans les siècles des siècles" }
  - { la: "Amen", it: "Amen", en: "Amen", es: "Amén", de: "Amen", fr: "Amen" }
