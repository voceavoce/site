comune: ubi-caritas
credit: "Traduzione automatica (Claude), non rivista"
license: "CC0 1.0"
righe:
  - { la: "Ubi caritas et amor Deus ibi est", it: "Dove c'è carità e amore, lì c'è Dio", en: "Where charity and love are, God is there", es: "Donde hay caridad y amor, allí está Dios", de: "Wo Güte und Liebe sind, da ist Gott", fr: "Là où sont charité et amour, Dieu est là" }
  - { la: "Congregavit nos in unum Christi amor", it: "L'amore di Cristo ci ha riuniti in uno", en: "The love of Christ has gathered us into one", es: "El amor de Cristo nos ha congregado en uno", de: "Die Liebe Christi hat uns zu einem vereint", fr: "L'amour du Christ nous a rassemblés en un" }
  - { la: "Exsultemus et in ipso iucundemur", alt: ["Exultemus et in ipso iucundemur"], it: "Esultiamo e rallegriamoci in lui", en: "Let us exult and rejoice in him", es: "Exultemos y alegrémonos en él", de: "Lasst uns jubeln und uns in ihm freuen", fr: "Exultons et réjouissons-nous en lui" }
  - { la: "Timeamus et amemus Deum vivum", it: "Temiamo e amiamo il Dio vivente", en: "Let us fear and love the living God", es: "Temamos y amemos al Dios vivo", de: "Lasst uns den lebendigen Gott fürchten und lieben", fr: "Craignons et aimons le Dieu vivant" }
  - { la: "Et ex corde diligamus nos sincero", it: "E amiamoci l'un l'altro con cuore sincero", en: "And let us love one another from a sincere heart", es: "Y amémonos unos a otros con corazón sincero", de: "Und lasst uns einander aus aufrichtigem Herzen lieben", fr: "Et aimons-nous les uns les autres d'un cœur sincère" }
  - { la: "Simul ergo cum in unum congregamur", it: "Dunque, quando siamo riuniti insieme", en: "So when we are gathered together", es: "Así pues, cuando estamos reunidos", de: "Wenn wir nun zusammenkommen", fr: "Donc, quand nous sommes rassemblés" }
  - { la: "Ne nos mente dividamur caveamus", it: "badiamo a non essere divisi nell'animo", en: "let us beware of being divided in mind", es: "cuidemos de no dividirnos en el ánimo", de: "hüten wir uns, im Geist getrennt zu sein", fr: "gardons-nous d'être divisés d'esprit" }
  - { la: "Cessent iurgia maligna cessent lites", it: "cessino le liti maligne, cessino i contrasti", en: "let wicked quarrels cease, let disputes cease", es: "cesen las disputas malignas, cesen los litigios", de: "böser Streit höre auf, Zank höre auf", fr: "que cessent les querelles mauvaises, que cessent les disputes" }
  - { la: "Et in medio nostri sit Christus Deus", it: "E in mezzo a noi sia Cristo Dio", en: "And may Christ our God be in our midst", es: "Y en medio de nosotros esté Cristo Dios", de: "Und in unserer Mitte sei Christus, unser Gott", fr: "Et que le Christ Dieu soit au milieu de nous" }
  - { la: "Simul quoque cum beatis videamus", it: "Possiamo vedere insieme anche con i beati", en: "May we also see, together with the blessed", es: "Veamos también, junto con los bienaventurados", de: "Lasst uns zugleich mit den Seligen schauen", fr: "Puissions-nous voir aussi avec les bienheureux" }
  - { la: "Glorianter vultum tuum Christe Deus", it: "glorificandolo, il tuo volto, o Cristo Dio", en: "in glory your face, O Christ our God", es: "gloriosamente tu rostro, oh Cristo Dios", de: "in Herrlichkeit dein Antlitz, Christus, unser Gott", fr: "dans la gloire ton visage, ô Christ Dieu" }
  - { la: "Gaudium quod est immensum atque probum", it: "gioia immensa e pura", en: "a joy immense and pure", es: "gozo inmenso y puro", de: "eine Freude, unermesslich und rein", fr: "une joie immense et pure" }
  - { la: "Saecula per infinita saeculorum", it: "per i secoli infiniti dei secoli", en: "through the infinite ages of ages", es: "por los siglos infinitos de los siglos", de: "durch die unendlichen Zeiten der Zeiten", fr: "pour les siècles infinis des siècles" }
  - { la: "Amen", it: "Amen", en: "Amen", es: "Amén", de: "Amen", fr: "Amen" }
