comune: tantum-ergo
credit: "Traduzione automatica (Claude), non rivista"
license: "CC0 1.0"
righe:
  - { la: "Tantum ergo sacramentum", it: "Un così grande sacramento", en: "So great a sacrament", es: "Tan grande sacramento", de: "Ein so großes Sakrament", fr: "Un si grand sacrement" }
  - { la: "veneremur cernui", it: "veneriamo prostrati", en: "we venerate with bowed heads", es: "veneremos inclinados", de: "lasst uns ehrfürchtig verehren", fr: "vénérons-le prosternés" }
  - { la: "et antiquum documentum", it: "e l'antica alleanza", en: "and let the ancient covenant", es: "y la antigua ley", de: "und die alte Ordnung", fr: "et que l'ancienne loi" }
  - { la: "novo cedat ritui", it: "ceda il passo al nuovo rito", en: "give way to the new rite", es: "ceda ante el nuevo rito", de: "weiche dem neuen Ritus", fr: "cède devant le nouveau rite" }
  - { la: "praestet fides supplementum", it: "la fede supplisca", en: "let faith supply", es: "que la fe supla", de: "der Glaube ersetze", fr: "que la foi supplée" }
  - { la: "sensuum defectui", it: "al difetto dei sensi", en: "the failing of the senses", es: "la deficiencia de los sentidos", de: "den Mangel der Sinne", fr: "à la défaillance des sens" }
  - { la: "Genitori genitoque", it: "Al Genitore e al Generato", en: "To the Father and the Son", es: "Al Padre y al Hijo", de: "Dem Erzeuger und dem Gezeugten", fr: "Au Père et au Fils" }
  - { la: "laus et iubilatio", it: "lode e giubilo", en: "praise and jubilation", es: "alabanza y júbilo", de: "Lob und Jubel", fr: "louange et jubilation" }
  - { la: "salus honor virtus quoque", it: "salvezza, onore e potenza", en: "salvation, honor and power too", es: "salvación, honor y poder también", de: "Heil, Ehre und auch Macht", fr: "salut, honneur et puissance aussi" }
  - { la: "sit et benedictio", it: "e benedizione", en: "and blessing be", es: "y bendición sean", de: "und Segen sei", fr: "et bénédiction soient" }
  - { la: "procedenti ab utroque", it: "A colui che procede da entrambi", en: "To him who proceeds from both", es: "Al que procede de ambos", de: "Dem, der von beiden ausgeht", fr: "À celui qui procède des deux" }
  - { la: "compar sit laudatio", it: "sia pari la lode", en: "be equal praise", es: "sea igual la alabanza", de: "sei gleiches Lob", fr: "soit égale la louange" }
  - { la: "Amen", it: "Amen", en: "Amen", es: "Amén", de: "Amen", fr: "Amen" }
