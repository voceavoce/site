comune: stabat-mater
credit: "Traduzione automatica (Claude), non rivista"
license: "CC0 1.0"
righe:
  - { la: "Stabat Mater dolorosa", it: "Stava la Madre addolorata", en: "The sorrowful Mother stood", es: "Estaba la Madre dolorosa", de: "Es stand die schmerzensreiche Mutter", fr: "Debout se tenait la Mère douloureuse" }
  - { la: "iuxta Crucem lacrimosa", it: "in lacrime accanto alla croce", en: "weeping beside the Cross", es: "llorosa junto a la cruz", de: "weinend neben dem Kreuz", fr: "en larmes près de la Croix" }
  - { la: "dum pendebat Filius", it: "mentre il Figlio pendeva", en: "while her Son hung there", es: "mientras pendía el Hijo", de: "während der Sohn hing", fr: "tandis que son Fils était suspendu" }
  - { la: "Cuius animam gementem", it: "La sua anima gemente", en: "Her groaning soul", es: "Su alma gimiente", de: "Ihre seufzende Seele", fr: "Son âme gémissante" }
  - { la: "contristatam et dolentem", alt: ["contristantem et dolentem"], it: "afflitta e dolente", en: "saddened and grieving", es: "entristecida y dolorida", de: "betrübt und leidend", fr: "attristée et souffrante" }
  - { la: "pertransivit gladius", it: "fu trapassata da una spada", en: "a sword pierced through", es: "la traspasó una espada", de: "durchbohrte ein Schwert", fr: "un glaive la transperça" }
  - { la: "O quam tristis et afflicta", it: "Oh, quanto triste e afflitta", en: "O how sad and afflicted", es: "Oh, qué triste y afligida", de: "O wie traurig und niedergedrückt", fr: "Ô combien triste et affligée" }
  - { la: "fuit illa benedicta", it: "fu quella benedetta", en: "was that blessed one", es: "fue aquella bendita", de: "war jene Gesegnete", fr: "fut cette bénie" }
  - { la: "mater Unigeniti", it: "madre dell'Unigenito", en: "mother of the Only-begotten", es: "madre del Unigénito", de: "Mutter des Einziggeborenen", fr: "mère du Fils unique" }
  - { la: "Quae maerebat et dolebat", alt: ["Quae moerebat et dolebat"], it: "Che si doleva e si affliggeva", en: "who mourned and grieved", es: "que se afligía y sufría", de: "die trauerte und litt", fr: "qui se lamentait et souffrait" }
  - { la: "pia Mater dum videbat", it: "la pia Madre, mentre vedeva", en: "the loving Mother, as she saw", es: "la piadosa Madre, al ver", de: "die liebende Mutter, als sie sah", fr: "la pieuse Mère, tandis qu'elle voyait" }
  - { la: "nati poenas inclyti", it: "le pene del glorioso Figlio", en: "the torments of her glorious Son", es: "las penas de su ínclito Hijo", de: "die Qualen ihres berühmten Sohnes", fr: "les peines de son illustre Fils" }
  - { la: "Quis est homo qui non fleret", it: "Chi è l'uomo che non piangerebbe", en: "Who is the man who would not weep", es: "¿Quién es el hombre que no lloraría", de: "Wer ist der Mensch, der nicht weinte", fr: "Quel est l'homme qui ne pleurerait pas" }
  - { la: "matrem Christi si videret", it: "se vedesse la madre di Cristo", en: "if he saw the mother of Christ", es: "si viera a la madre de Cristo", de: "wenn er die Mutter Christi sähe", fr: "s'il voyait la mère du Christ" }
  - { la: "in tanto supplicio", it: "in così grande supplizio", en: "in such great torment", es: "en tan gran suplicio", de: "in so großer Pein", fr: "dans un si grand supplice" }
  - { la: "Quis non posset contristari", it: "Chi non potrebbe rattristarsi", en: "Who could not be saddened", es: "¿Quién no podría entristecerse", de: "Wer könnte nicht mittrauern", fr: "Qui ne pourrait être attristé" }
  - { la: "Christi Matrem contemplari", it: "contemplando la Madre di Cristo", en: "contemplating the Mother of Christ", es: "al contemplar a la Madre de Cristo", de: "wenn er die Mutter Christi betrachtet", fr: "en contemplant la Mère du Christ" }
  - { la: "dolentem cum Filio", it: "che soffre con il Figlio", en: "grieving with her Son", es: "doliéndose con el Hijo", de: "leidend mit dem Sohn", fr: "souffrant avec son Fils" }
  - { la: "Pro peccatis suae gentis", it: "Per i peccati del suo popolo", en: "For the sins of his people", es: "Por los pecados de su pueblo", de: "Für die Sünden seines Volkes", fr: "Pour les péchés de son peuple" }
  - { la: "vidit Iesum in tormentis", it: "vide Gesù nei tormenti", en: "she saw Jesus in torments", es: "vio a Jesús en tormentos", de: "sah sie Jesus in Qualen", fr: "elle vit Jésus dans les tourments" }
  - { la: "et flagellis subditum", it: "e sottoposto ai flagelli", en: "and subjected to the scourges", es: "y sometido a los azotes", de: "und den Geißeln ausgesetzt", fr: "et soumis aux fouets" }
  - { la: "Vidit suum dulcem Natum", it: "Vide il suo dolce Figlio", en: "She saw her sweet Son", es: "Vio a su dulce Hijo", de: "Sie sah ihren süßen Sohn", fr: "Elle vit son doux Fils" }
  - { la: "moriendo desolatum", it: "morire abbandonato", en: "dying forsaken", es: "muriendo desolado", de: "verlassen sterben", fr: "mourant abandonné" }
  - { la: "dum emisit spiritum", it: "mentre esalava lo spirito", en: "as he gave up the spirit", es: "mientras entregaba el espíritu", de: "als er den Geist aufgab", fr: "tandis qu'il rendait l'esprit" }
  - { la: "Eia Mater fons amoris", it: "Orsù, Madre, fonte d'amore", en: "O Mother, fountain of love", es: "Ea, Madre, fuente de amor", de: "Wohlan, Mutter, Quell der Liebe", fr: "Allons, Mère, source d'amour" }
  - { la: "me sentire vim doloris", it: "fammi sentire la forza del dolore", en: "let me feel the power of sorrow", es: "hazme sentir la fuerza del dolor", de: "lass mich die Kraft des Schmerzes spüren", fr: "fais-moi sentir la force de la douleur" }
  - { la: "fac ut tecum lugeam", it: "perché io pianga con te", en: "that I may mourn with you", es: "para que llore contigo", de: "damit ich mit dir trauere", fr: "afin que je pleure avec toi" }
  - { la: "Fac ut ardeat cor meum", it: "Fa' che arda il mio cuore", en: "Make my heart burn", es: "Haz que arda mi corazón", de: "Lass mein Herz brennen", fr: "Fais que mon cœur brûle" }
  - { la: "in amando Christum Deum", it: "nell'amare Cristo Dio", en: "in loving Christ my God", es: "en el amor a Cristo Dios", de: "in der Liebe zu Christus, Gott", fr: "dans l'amour du Christ Dieu" }
  - { la: "ut sibi complaceam", it: "per piacere a lui", en: "that I may please him", es: "para agradarle", de: "damit ich ihm gefalle", fr: "afin que je lui plaise" }
  - { la: "Sancta Mater istud agas", it: "Santa Madre, fa' questo", en: "Holy Mother, grant this", es: "Santa Madre, haz esto", de: "Heilige Mutter, tu dies", fr: "Sainte Mère, fais ceci" }
  - { la: "crucifixi fige plagas", it: "imprimi le piaghe del crocifisso", en: "fix the wounds of the crucified", es: "graba las llagas del crucificado", de: "präge die Wunden des Gekreuzigten ein", fr: "grave les plaies du crucifié" }
  - { la: "cordi meo valide", it: "con forza nel mio cuore", en: "firmly in my heart", es: "con fuerza en mi corazón", de: "fest in mein Herz", fr: "fortement dans mon cœur" }
  - { la: "Tui Nati vulnerati", it: "Del tuo Figlio ferito", en: "Of your wounded Son", es: "De tu Hijo herido", de: "Deines verwundeten Sohnes", fr: "De ton Fils blessé" }
  - { la: "tam dignati pro me pati", it: "che si è degnato di soffrire per me", en: "who deigned to suffer so for me", es: "que se dignó padecer tanto por mí", de: "der sich würdigte, so für mich zu leiden", fr: "qui a daigné souffrir ainsi pour moi" }
  - { la: "poenas mecum divide", it: "dividi con me le pene", en: "share the pains with me", es: "comparte conmigo las penas", de: "teile die Qualen mit mir", fr: "partage avec moi les peines" }
  - { la: "Fac me tecum pie flere", it: "Fammi piangere devotamente con te", en: "Let me weep devoutly with you", es: "Haz que llore piadosamente contigo", de: "Lass mich fromm mit dir weinen", fr: "Fais-moi pleurer pieusement avec toi" }
  - { la: "crucifixo condolere", it: "e condividere il dolore del crocifisso", en: "and share the sorrow of the crucified", es: "y compadecer al crucificado", de: "und mit dem Gekreuzigten mitleiden", fr: "et compatir avec le crucifié" }
  - { la: "donec ego vixero", it: "finché vivrò", en: "as long as I shall live", es: "mientras yo viva", de: "solange ich lebe", fr: "tant que je vivrai" }
  - { la: "Iuxta Crucem tecum stare", it: "Stare con te accanto alla croce", en: "To stand with you beside the Cross", es: "Estar contigo junto a la cruz", de: "Mit dir unter dem Kreuz zu stehen", fr: "Me tenir avec toi près de la Croix" }
  - { la: "et me tibi sociare", it: "e unirmi a te", en: "and to join myself to you", es: "y unirme a ti", de: "und mich dir zu gesellen", fr: "et m'associer à toi" }
  - { la: "in planctu desidero", it: "nel pianto, lo desidero", en: "in your lament, this I desire", es: "en el llanto, lo deseo", de: "in der Klage, das ersehne ich", fr: "dans ta plainte, je le désire" }
  - { la: "Virgo virginum praeclara", it: "Vergine fra le vergini, illustre", en: "Virgin of virgins, most renowned", es: "Virgen de las vírgenes, esclarecida", de: "Jungfrau der Jungfrauen, strahlende", fr: "Vierge des vierges, éclatante" }
  - { la: "mihi iam non sis amara", it: "ormai non essere dura con me", en: "now be not bitter to me", es: "ya no seas áspera conmigo", de: "sei nun nicht herb gegen mich", fr: "ne sois plus amère envers moi" }
  - { la: "fac me tecum plangere", it: "fammi piangere con te", en: "let me lament with you", es: "haz que llore contigo", de: "lass mich mit dir klagen", fr: "fais-moi me lamenter avec toi" }
  - { la: "Fac ut portem Christi mortem", it: "Fa' che io porti la morte di Cristo", en: "Let me bear the death of Christ", es: "Haz que lleve la muerte de Cristo", de: "Lass mich den Tod Christi tragen", fr: "Fais que je porte la mort du Christ" }
  - { la: "passionis fac consortem", it: "rendimi partecipe della sua passione", en: "make me a sharer in his passion", es: "hazme partícipe de su pasión", de: "mache mich zum Teilhaber seiner Passion", fr: "fais-moi partager sa passion" }
  - { la: "et plagas recolere", it: "e a ricordare le sue piaghe", en: "and to remember his wounds", es: "y a recordar sus llagas", de: "und seine Wunden zu bedenken", fr: "et me remémorer ses plaies" }
  - { la: "Fac me plagis vulnerari", it: "Fammi ferire dalle sue piaghe", en: "Let me be wounded with his wounds", es: "Haz que sea herido con sus llagas", de: "Lass mich mit seinen Wunden verwundet werden", fr: "Fais que je sois blessé de ses plaies" }
  - { la: "fac me Cruce inebriari", it: "fammi inebriare della croce", en: "let me be inebriated by the Cross", es: "haz que me embriague de la cruz", de: "lass mich vom Kreuz trunken werden", fr: "fais que je m'enivre de la Croix" }
  - { la: "et cruore Filii", it: "e del sangue del Figlio", en: "and by the blood of the Son", es: "y de la sangre del Hijo", de: "und vom Blut des Sohnes", fr: "et du sang du Fils" }
  - { la: "Flammis ne urar succensus", it: "Perché non arda, infiammato, nelle fiamme", en: "Lest I burn, kindled by flames", es: "Para que no arda, encendido, en las llamas", de: "Damit ich nicht, entflammt, in Flammen brenne", fr: "Pour que je ne brûle pas, enflammé, dans les flammes" }
  - { la: "per te Virgo sim defensus", it: "per mezzo tuo, o Vergine, sia difeso", en: "through you, Virgin, may I be defended", es: "por ti, Virgen, sea defendido", de: "durch dich, Jungfrau, sei ich beschützt", fr: "par toi, Vierge, sois mon défenseur" }
  - { la: "in die iudicii", it: "nel giorno del giudizio", en: "on the day of judgment", es: "en el día del juicio", de: "am Tag des Gerichts", fr: "au jour du jugement" }
  - { la: "Christe cum sit hinc exire", it: "O Cristo, quando sarà tempo di partire da qui", en: "O Christ, when it is time to depart from here", es: "Oh Cristo, cuando llegue la hora de salir de aquí", de: "Christus, wenn es Zeit ist, von hier zu scheiden", fr: "Ô Christ, quand il sera temps de partir d'ici" }
  - { la: "da per Matrem me venire", it: "concedi che io giunga, per mezzo della Madre", en: "grant that through your Mother I may come", es: "concede que por medio de la Madre yo llegue", de: "gib, dass ich durch die Mutter gelange", fr: "accorde que par la Mère je parvienne" }
  - { la: "ad palmam victoriae", it: "alla palma della vittoria", en: "to the palm of victory", es: "a la palma de la victoria", de: "zur Siegespalme", fr: "à la palme de la victoire" }
  - { la: "Quando corpus morietur", it: "Quando il corpo morirà", en: "When the body dies", es: "Cuando el cuerpo muera", de: "Wenn der Leib stirbt", fr: "Quand le corps mourra" }
  - { la: "fac ut animae donetur", it: "fa' che all'anima sia donata", en: "grant that to the soul be given", es: "haz que al alma se le conceda", de: "lass der Seele geschenkt werden", fr: "fais que soit donnée à l'âme" }
  - { la: "paradisi gloria", it: "la gloria del paradiso", en: "the glory of paradise", es: "la gloria del paraíso", de: "die Herrlichkeit des Paradieses", fr: "la gloire du paradis" }
  - { la: "Amen", it: "Amen", en: "Amen", es: "Amén", de: "Amen", fr: "Amen" }
