comune: o-salutaris
credit: "Traduzione automatica (Claude), non rivista"
license: "CC0 1.0"
righe:
  - { la: "O salutaris Hostia", it: "O Ostia di salvezza", en: "O saving Victim", es: "Oh Hostia salvadora", de: "O heilbringende Opfergabe", fr: "Ô Hostie salutaire" }
  - { la: "Quae caeli pandis ostium", it: "che apri la porta del cielo", en: "who opens the gate of heaven", es: "que abres la puerta del cielo", de: "die du die Pforte des Himmels öffnest", fr: "qui ouvres la porte du ciel" }
  - { la: "Bella premunt hostilia", it: "Guerre nemiche ci assediano", en: "Hostile wars press upon us", es: "Nos oprimen guerras hostiles", de: "Feindliche Kriege bedrängen uns", fr: "Des guerres hostiles nous pressent" }
  - { la: "Da robur fer auxilium", it: "dacci forza, portaci aiuto", en: "give us strength, bring us aid", es: "danos fuerza, trae auxilio", de: "gib Kraft, bring Hilfe", fr: "donne-nous la force, apporte ton secours" }
  - { la: "Uni trinoque Domino", it: "Al Signore uno e trino", en: "To the Lord, one and three", es: "Al Señor uno y trino", de: "Dem einen und dreifaltigen Herrn", fr: "Au Seigneur un et trine" }
  - { la: "Sit sempiterna gloria", it: "sia gloria eterna", en: "be everlasting glory", es: "sea gloria eterna", de: "sei ewige Ehre", fr: "soit gloire éternelle" }
  - { la: "Qui vitam sine termino", it: "colui che una vita senza fine", en: "who gives life without end", es: "que una vida sin fin", de: "der Leben ohne Ende", fr: "qui une vie sans fin" }
  - { la: "Nobis donet in patria", it: "ci doni nella patria", en: "to us in our homeland", es: "nos conceda en la patria", de: "uns schenke in der Heimat", fr: "nous donne dans la patrie" }
  - { la: "Amen", it: "Amen", en: "Amen", es: "Amén", de: "Amen", fr: "Amen" }
