  - { la: "quem in mundi pretium", it: "che come prezzo per il mondo", en: "which as the world's ransom", es: "que como rescate del mundo", de: "das als Lösegeld für die Welt", fr: "que, rançon du monde," }
  - { la: "fructus ventris generosi", it: "frutto di un grembo nobile", en: "the fruit of a noble womb", es: "fruto de un vientre generoso", de: "die Frucht eines edlen Schoßes", fr: "fruit d'un sein généreux" }
  - { la: "Rex effudit gentium", it: "il Re dei popoli ha versato", en: "the King of the nations poured out", es: "el Rey de las naciones derramó", de: "der König der Völker vergossen hat", fr: "le Roi des nations a répandu" }
  - { la: "Nobis datus nobis natus", it: "Dato a noi, nato per noi", en: "Given to us, born for us", es: "Dado a nosotros, nacido para nosotros", de: "Uns gegeben, uns geboren", fr: "Donné à nous, né pour nous" }
  - { la: "ex intacta Virgine", it: "da una Vergine intatta", en: "of a Virgin untouched", es: "de una Virgen intacta", de: "aus der unversehrten Jungfrau", fr: "d'une Vierge intacte" }
