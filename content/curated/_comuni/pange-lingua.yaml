righe:
  - { la: "Pange lingua gloriosi", it: "Canta, o lingua, il mistero", en: "Sing, my tongue, the mystery", es: "Canta, lengua, el misterio", de: "Besinge, Zunge, das Geheimnis", fr: "Chante, ma langue, le mystère" }
