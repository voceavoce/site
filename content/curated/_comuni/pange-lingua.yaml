  - { la: "sui moras incolatus", it: "il tempo della sua dimora", en: "the days of his sojourn", es: "el tiempo de su estancia", de: "die Zeit seines Aufenthalts", fr: "le temps de son séjour" }
  - { la: "miro clausit ordine", it: "chiuse con un ordine mirabile", en: "he ended in a wondrous way", es: "lo cerró con un orden admirable", de: "beschloss er auf wunderbare Weise", fr: "il le termina d'une manière admirable" }
  - { la: "In supremae nocte cenae", alt: ["In supremae nocte coenae"], it: "Nella notte dell'ultima cena", en: "On the night of the last supper", es: "En la noche de la última cena", de: "In der Nacht des letzten Abendmahls", fr: "Dans la nuit de la dernière cène" }
  - { la: "recumbens cum fratribus", it: "a tavola con i suoi fratelli", en: "reclining with his brethren", es: "recostado con sus hermanos", de: "zu Tisch mit seinen Brüdern", fr: "à table avec ses frères" }
  - { la: "observata lege plene", it: "osservata pienamente la legge", en: "having fully kept the law", es: "cumplida plenamente la ley", de: "nachdem er das Gesetz vollständig erfüllt", fr: "ayant pleinement observé la loi" }
  - { la: "cibis in legalibus", it: "con i cibi prescritti", en: "with the foods it prescribes", es: "con los alimentos legales", de: "mit den vorgeschriebenen Speisen", fr: "avec les mets prescrits" }
  - { la: "cibum turbae duodenae", it: "come cibo al gruppo dei dodici", en: "as food for the band of twelve", es: "como alimento para el grupo de los doce", de: "als Speise für die Schar der Zwölf", fr: "comme nourriture pour la troupe des douze" }
  - { la: "se dat suis manibus", it: "si dà con le sue mani", en: "he gives himself with his own hands", es: "se da con sus propias manos", de: "gibt er sich mit eigenen Händen", fr: "il se donne de ses propres mains" }
