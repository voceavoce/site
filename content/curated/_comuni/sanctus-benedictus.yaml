righe:
  - { la: "Sanctus Sanctus Sanctus", it: "Santo, Santo, Santo", en: "Holy, Holy, Holy", es: "Santo, Santo, Santo", de: "Heilig, heilig, heilig", fr: "Saint, Saint, Saint" }
  - { la: "Sanctus", it: "Santo", en: "Holy", es: "Santo", de: "Heilig", fr: "Saint" }
  - { la: "Dominus Deus Sabaoth", it: "Signore Dio dell'universo", en: "Lord God of hosts", es: "Señor Dios del universo", de: "Herr, Gott der Heerscharen", fr: "Seigneur, Dieu de l'univers" }
  - { la: "Pleni sunt caeli et terra gloria tua", alt: ["Pleni sunt coeli et terra gloria tua"], it: "I cieli e la terra sono pieni della tua gloria", en: "Heaven and earth are full of your glory", es: "Llenos están el cielo y la tierra de tu gloria", de: "Himmel und Erde sind erfüllt von deiner Herrlichkeit", fr: "Le ciel et la terre sont remplis de ta gloire" }
  - { la: "Pleni sunt caeli et terra", alt: ["Pleni sunt coeli et terra"], it: "I cieli e la terra sono pieni", en: "Heaven and earth are full", es: "Llenos están el cielo y la tierra", de: "Himmel und Erde sind erfüllt", fr: "Le ciel et la terre sont remplis" }
  - { la: "gloria tua", it: "della tua gloria", en: "of your glory", es: "de tu gloria", de: "von deiner Herrlichkeit", fr: "de ta gloire" }
  - { la: "Hosanna in excelsis", it: "Osanna nell'alto dei cieli", en: "Hosanna in the highest", es: "Hosanna en el cielo", de: "Hosanna in der Höhe", fr: "Hosanna au plus haut des cieux" }
  - { la: "Benedictus qui venit in nomine Domini", it: "Benedetto colui che viene nel nome del Signore", en: "Blessed is he who comes in the name of the Lord", es: "Bendito el que viene en nombre del Señor", de: "Gesegnet, der kommt im Namen des Herrn", fr: "Béni soit celui qui vient au nom du Seigneur" }
