nota:
  it: "Anthem in inglese per il servizio anglicano di Thomas Tallis (c. 1505–1585), compositore che servì sotto più sovrani Tudor. Quattro voci con il testo ben scandito."
  en: "An English anthem for the Anglican service by Thomas Tallis (c. 1505–1585), who served under several Tudor monarchs. Four voices with clearly articulated text."
  es: "Anthem en inglés para el servicio anglicano de Thomas Tallis (c. 1505–1585), que sirvió bajo varios monarcas Tudor. Cuatro voces con el texto bien articulado."
  de: "Englisches Anthem für den anglikanischen Gottesdienst von Thomas Tallis (um 1505–1585), der unter mehreren Tudor-Monarchen diente. Vier Stimmen mit klar artikuliertem Text."
  fr: "Anthem anglais pour l'office anglican de Thomas Tallis (vers 1505–1585), qui servit sous plusieurs souverains Tudor. Quatre voix avec un texte clairement articulé."
