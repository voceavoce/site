nota:
  it: "Brano in latino a quattro voci di Michael Praetorius (1571–1621), compositore tedesco del primo Barocco, autore anche del trattato Syntagma musicum. Il titolo è un invito all'ascolto: «ascoltate, tacete»."
  en: "A four-voice Latin piece by Michael Praetorius (1571–1621), an early Baroque German composer who also wrote the treatise Syntagma musicum. The title is an invitation to listen: “hear, be silent”."
  es: "Obra en latín a cuatro voces de Michael Praetorius (1571–1621), compositor alemán del primer Barroco, autor también del tratado Syntagma musicum. El título es una invitación a escuchar: «oíd, callad»."
