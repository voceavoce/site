nota:
  it: "Carol tradizionale inglese, attestato dal Seicento: tre navi entrano in porto il giorno di Natale. Qui in un arrangiamento a quattro voci."
  en: "A traditional English carol, attested since the seventeenth century: three ships sail in on Christmas Day. Here in a four-voice arrangement."
  es: "Villancico tradicional inglés, documentado desde el siglo XVII: tres barcos llegan a puerto el día de Navidad. Aquí en un arreglo a cuatro voces."
