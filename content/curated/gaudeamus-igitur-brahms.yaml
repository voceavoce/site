nota:
  it: "Canto goliardico universitario di origine medievale, che Johannes Brahms (1833–1897) cita nell'Ouverture accademica (1880). Qui è nella versione a quattro voci."
  en: "A medieval-rooted student song that Johannes Brahms (1833–1897) quotes in his Academic Festival Overture (1880). Here in a four-voice version."
  es: "Canto estudiantil universitario de origen medieval, que Johannes Brahms (1833–1897) cita en su Obertura académica (1880). Aquí en versión a cuatro voces."
  de: "Studentenlied mit mittelalterlichen Wurzeln, das Johannes Brahms (1833–1897) in seiner Akademischen Festouvertüre (1880) zitiert. Hier in einer vierstimmigen Fassung."
  fr: "Chant estudiantin d'origine médiévale que Johannes Brahms (1833–1897) cite dans son Ouverture académique (1880). Ici dans une version à quatre voix."
