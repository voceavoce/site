nota:
  it: "Inno nazionale degli Stati Uniti: il testo è di Francis Scott Key (1814), la melodia di John Stafford Smith (1750–1836), nata per un club musicale londinese. L'ampia estensione è una sfida per ogni voce."
  en: "The national anthem of the United States: the text is by Francis Scott Key (1814), the tune by John Stafford Smith (1750–1836), written for a London music club. Its wide range is a challenge for every voice."
  es: "Himno nacional de Estados Unidos: el texto es de Francis Scott Key (1814) y la melodía de John Stafford Smith (1750–1836), escrita para un club musical londinense. Su amplia extensión es un reto para cualquier voz."
  de: "Die Nationalhymne der Vereinigten Staaten: Der Text stammt von Francis Scott Key (1814), die Melodie von John Stafford Smith (1750–1836), geschrieben für einen Londoner Musikclub. Ihr großer Tonumfang ist für jede Stimme eine Herausforderung."
  fr: "L'hymne national des États-Unis : le texte est de Francis Scott Key (1814), la mélodie de John Stafford Smith (1750–1836), écrite pour un club musical londonien. Sa grande étendue est un défi pour chaque voix."
