nota:
  it: "Inno eucaristico del Trecento che William Byrd mise in musica a quattro voci nei Gradualia (1605). Frasi lunghe e legate: il fiato e l'intonazione sono il vero lavoro."
  en: "A fourteenth-century Eucharistic hymn that William Byrd set for four voices in his Gradualia (1605). Long, flowing phrases: breath control and intonation are the real work."
  es: "Himno eucarístico del siglo XIV que William Byrd puso en música a cuatro voces en sus Gradualia (1605). Frases largas y ligadas: el aliento y la afinación son el verdadero trabajo."
  de: "Eucharistischer Hymnus aus dem 14. Jahrhundert, den William Byrd in seinen Gradualia (1605) für vier Stimmen vertonte. Lange, fließende Phrasen: Atemführung und Intonation sind die eigentliche Arbeit."
  fr: "Hymne eucharistique du XIVe siècle que William Byrd a mis en musique à quatre voix dans ses Gradualia (1605). De longues phrases liées : le souffle et la justesse sont le vrai travail."
