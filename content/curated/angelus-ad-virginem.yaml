nota:
  it: "Carol medievale in latino sull'Annunciazione, anonimo, tramandato da manoscritti inglesi del Trecento. Qui è in un arrangiamento per tre voci (soprano, alto e basso)."
  en: "An anonymous medieval Latin carol on the Annunciation, handed down in fourteenth-century English manuscripts. Here in an arrangement for three voices (soprano, alto and bass)."
  es: "Villancico medieval anónimo en latín sobre la Anunciación, transmitido por manuscritos ingleses del siglo XIV. Aquí en un arreglo para tres voces (soprano, alto y bajo)."
  de: "Anonymes mittelalterliches lateinisches Carol über die Verkündigung, überliefert in englischen Handschriften des 14. Jahrhunderts. Hier in einem Arrangement für drei Stimmen (Sopran, Alt und Bass)."
  fr: "Chant de Noël médiéval anonyme en latin sur l'Annonciation, transmis par des manuscrits anglais du XIVe siècle. Ici dans un arrangement à trois voix (soprano, alto et basse)."
