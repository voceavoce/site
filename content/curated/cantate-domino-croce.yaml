nota:
  it: "Mottetto a quattro voci di Giovanni Croce (c. 1557–1609), attivo a Venezia e maestro di cappella a San Marco. «Cantate Domino canticum novum» è un incipit che si trova in più salmi."
  en: "A four-voice motet by Giovanni Croce (c. 1557–1609), active in Venice and maestro di cappella at St Mark's. “Cantate Domino canticum novum” is an opening that appears in several psalms."
  es: "Motete a cuatro voces de Giovanni Croce (c. 1557–1609), activo en Venecia y maestro de capilla en San Marcos. «Cantate Domino canticum novum» es un comienzo que aparece en varios salmos."
