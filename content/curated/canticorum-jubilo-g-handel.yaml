nota:
  it: "Brano corale in latino a quattro voci di Georg Friedrich Händel (1685–1759). Il titolo significa «con il giubilo dei canti»."
  en: "A four-voice Latin choral piece by George Frideric Handel (1685–1759). The title means “with the jubilation of songs”."
  es: "Obra coral en latín a cuatro voces de Georg Friedrich Händel (1685–1759). El título significa «con el júbilo de los cantos»."
