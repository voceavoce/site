nota:
  it: "Mottetto funebre a sei voci di Alonso Lobo, spagnolo del Rinascimento, pubblicato nel Liber primus missarum (1602). Il testo viene da Giobbe 30,31: «La mia cetra si è mutata in lutto»."
  en: "A six-voice funeral motet by Alonso Lobo, a Spanish Renaissance composer, published in the Liber primus missarum (1602). The text comes from Job 30:31: “My harp is turned to mourning”."
  es: "Motete fúnebre a seis voces de Alonso Lobo, compositor español del Renacimiento, publicado en el Liber primus missarum (1602). El texto procede de Job 30,31: «Mi arpa se ha vuelto luto»."
  de: "Sechsstimmige Trauermotette von Alonso Lobo, einem spanischen Renaissancekomponisten, veröffentlicht im Liber primus missarum (1602). Der Text stammt aus Hiob 30,31: „Meine Harfe ist zur Klage geworden“."
  fr: "Motet funèbre à six voix d'Alonso Lobo, compositeur espagnol de la Renaissance, publié dans le Liber primus missarum (1602). Le texte vient de Job 30,31 : « Ma harpe s'est changée en deuil »."
