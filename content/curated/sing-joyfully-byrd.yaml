nota:
  it: "Anthem in inglese di William Byrd (c. 1540–1623) sul Salmo 81: «Cantate con gioia a Dio, nostra forza». Energico e festoso."
  en: "An English anthem by William Byrd (c. 1540–1623) on Psalm 81: “Sing joyfully unto God our strength”. Energetic and festive."
  es: "Anthem en inglés de William Byrd (c. 1540–1623) sobre el Salmo 81: «Cantad con alegría a Dios, nuestra fuerza». Enérgico y festivo."
